<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE Core Track</title>
<style>
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-2: #f0f0ec;
  --text: #1c1c1e;
  --muted: #62646a;
  --border: #e0e0da;
  --accent: #2c55d6;
  --accent-soft: #e7edfc;
  --good: #17784a;
  --good-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe8e6;
  --warn-soft: #fdf3dc;
  --code-bg: #f2f2ee;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --surface: #1b1c1f; --surface-2: #232428; --text: #ececee; --muted: #a0a2a8;
    --border: #303137; --accent: #8aa8ff; --accent-soft: #1f2a4a; --good: #6fd39b; --good-soft: #16301f;
    --bad: #ff8a80; --bad-soft: #3a1d1b; --warn-soft: #3a3016; --code-bg: #232428;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --surface: #1b1c1f; --surface-2: #232428; --text: #ececee; --muted: #a0a2a8;
  --border: #303137; --accent: #8aa8ff; --accent-soft: #1f2a4a; --good: #6fd39b; --good-soft: #16301f;
  --bad: #ff8a80; --bad-soft: #3a1d1b; --warn-soft: #3a3016; --code-bg: #232428;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre code { overflow-wrap: normal; }
pre.code { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; line-height: 1.5; margin: 0; }
pre.code code { background: none; padding: 0; }
h1, h2, h3 { line-height: 1.25; letter-spacing: -0.01em; }
h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 0 0 10px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text); text-decoration: none; min-width: 0; }
.brand span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { background: var(--accent); color: var(--surface); border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
.top-progress { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.bar { width: 140px; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
.menu-btn { display: none; }

/* layout */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 55px); }
.side { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 10px 40px; position: sticky; top: 55px; height: calc(100vh - 55px); overflow-y: auto; }
.side h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 8px 6px; }
.side a.nav { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 7px; color: var(--text); text-decoration: none; font-size: 14px; }
.side a.nav:hover { background: var(--surface-2); }
.side a.nav.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side a.nav .st { width: 18px; flex: none; text-align: center; }
.side a.nav .sc { margin-left: auto; font-size: 11px; color: var(--muted); flex: none; }
.side a.nav.checkpoint { font-style: italic; }
.side .tracks a { display: block; padding: 4px 8px; font-size: 13px; }
main { padding: 28px 32px 80px; max-width: 980px; width: 100%; outline: none; }

/* blocks */
.block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin: 0 0 16px; box-shadow: var(--shadow); }
.block > h3 .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; margin-right: 8px; vertical-align: 2px; }
.block p { margin: 0 0 10px; }
.block p:last-child { margin-bottom: 0; }
.block ul, .block ol { margin: 0; padding-left: 22px; }
.block li { margin: 4px 0; }
.block.callout { background: var(--warn-soft); }
.block.csnote { border-left: 4px solid var(--accent); }
.block.concept h3 { margin-bottom: 12px; }
.c-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-top: 1px solid var(--border); }
.c-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 3px; }
.c-body > * + * { margin-top: 10px; }
.c-body p { margin: 0 0 8px; }
.walk { padding-left: 22px; margin: 0; }
.walk > li { margin: 0 0 12px; }
.walk > li > div { margin-top: 4px; }
@media (max-width: 600px) { .c-row { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.hero { margin-bottom: 18px; }
.hero .kicker { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

figure.visual { margin: 0; }
figure.visual .diagram { overflow-x: auto; text-align: center; padding: 6px 0; }
figure.visual .diagram svg { max-width: 100%; height: auto; }
figure.visual pre.mermaid-src { text-align: left; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
.table-wrap { overflow-x: auto; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
td.chk { width: 32px; }
tr.solved td { color: var(--muted); }
tr.solved td a { color: var(--muted); text-decoration: line-through; }
.diff { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.diff.Easy { background: var(--good-soft); color: var(--good); }
.diff.Medium { background: var(--warn-soft); color: #9a6700; }
.diff.Hard { background: var(--bad-soft); color: var(--bad); }
:root[data-theme="dark"] .diff.Medium { color: #e3b341; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .diff.Medium { color: #e3b341; } }

/* quiz */
.q { padding: 14px 0; border-top: 1px solid var(--border); }
.q:first-of-type { border-top: 0; padding-top: 4px; }
.q-text { margin: 0 0 10px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 9px 12px; font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .letter { font-weight: 700; color: var(--muted); flex: none; }
.opt.correct { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.why { margin: 10px 0 0; font-size: 14px; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; }
.ok { color: var(--good); } .no { color: var(--bad); }
.quiz-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.score { font-weight: 600; }

/* controls */
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: inherit; background: var(--surface); color: var(--text); resize: vertical; }
.progress-block { white-space: pre-wrap; }

.roadmap { list-style: none; padding: 0 !important; margin: 0; }
.roadmap li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); margin: 0 !important; }
.roadmap li:last-child { border-bottom: 0; }
.roadmap .sc { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.cmds { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.cmds code { font-weight: 600; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .side { display: none; position: fixed; top: 55px; left: 0; right: 0; bottom: 0; height: auto; z-index: 15; border-right: 0; }
  body.nav-open .side { display: block; }
  main { padding: 20px 16px 60px; }
  .bar { width: 70px; }
  .block { padding: 16px; }
  figure.visual .diagram.wide svg { min-width: 620px; }
}

</style>
</head>

<header class="top">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
  <a class="brand" href="#home"><span class="badge">A</span><span id="trackName"></span></a>
  <div class="top-progress" title="Modules completed">
    <div class="bar"><span id="barFill"></span></div><span id="barText"></span>
  </div>
  <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light / dark"></button>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main" tabindex="-1"></main>
</div>

__modA(1, "The FDE role", "What a Forward Deployed Engineer does, and how to turn a vague business ask into a scoped, measurable project: discovery, baselines, thin slices, specs, demos, pilots, and working inside a customer's environment.", [
  { type: "visual", h: "The FDE engagement loop", tag: "Visual", caption: "Read left to right. Each box is a stage explained in a concept card below. The loop back from Measure means you expand scope only after the first slice has proven value.", mermaid: `
flowchart LR
  A["Vague ask<br/>'We want AI for claims'"] --> B["Discovery<br/>learn the real workflow,<br/>pain, data, people"]
  B --> C["Scoping<br/>pick ONE measurable<br/>thin slice"]
  C --> D["Spec + demo<br/>1-page spec, demo on<br/>their real data"]
  D --> E["Pilot<br/>real users, real env,<br/>measured vs baseline"]
  E --> F["Production<br/>hardening, handover,<br/>support"]
  F --> G["Measure<br/>did the number move?"]
  G -->|"expand to next slice"| C
  G -->|"patterns seen at many customers"| H["Core product team"]
` },

  { type: "concept", tag: "Concept 1", h: "What a Forward Deployed Engineer is",
    what: "A Forward Deployed Engineer (FDE) is a software engineer who works directly with one customer (or a few) to make the company's product solve that customer's real problem. “Forward deployed” is a military phrase: you are placed out in the field, close to the problem, instead of back at headquarters.\n\nYou write real production code: integrations, data pipelines, agents, UIs. But nobody hands you a ticket saying what to build. You start from a business problem, find out what is actually going on, decide what to build, build it inside the customer's systems, and prove it worked.",
    analogy: "A product engineer builds a car in the factory. An FDE drives to the customer's farm, finds out they actually need to pull a trailer through mud, fits the tow hitch and winter tyres, teaches the farmer to use it, and phones the factory saying “every farm customer needs a tow hitch, make it standard”.",
    why: "AI products rarely work out of the box in a large company. The data is messy, the workflow is unusual, security rules are strict, and the people are unsure what the product can do. Companies like Palantir, OpenAI, Anthropic, Scale AI and many AI startups hire FDEs because a deal only turns into lasting revenue once someone makes the product deliver measurable value on the customer's side.",
    how: [
      "**Understand the business problem.** Talk to users, watch them work, and collect numbers.",
      "**Decide what to build.** Pick the smallest thing that moves an important number (the “thin slice”).",
      "**Build it in their environment.** Deal with their identity provider, network, data and security review.",
      "**Prove it worked.** Measure against the baseline and report to the executive sponsor.",
      "**Feed back to product.** If you build the same thing for three customers, it should become a product feature, not more custom code."
    ],
    table: { cols: ["", "Product software engineer", "Forward Deployed Engineer", "Solutions / sales engineer"], rows: [
      ["Input", "A ticket or spec", "A business problem", "A prospect's questions"],
      ["Output", "Product features", "A working deployment + measured impact", "A demo and a closed deal"],
      ["Writes production code?", "Yes", "Yes, in the customer's environment", "Rarely"],
      ["Success measured by", "Features shipped, quality", "The customer's metric moved; account grows", "Revenue closed"]
    ] },
    pitfalls: [
      "Behaving like a consultant who only writes slides. FDEs are judged on working software.",
      "Behaving like a contractor who builds whatever is asked. Your job is to find out what should be built.",
      "Building one-off custom code for everything. Push reusable parts back into the product."
    ] },

  { type: "concept", tag: "Concept 2", h: "Discovery: finding out what is really going on",
    what: "Discovery is the first phase of an engagement. You interview people and watch them work to understand four things: (1) the current workflow, step by step, (2) where it hurts, measured in numbers, (3) who is involved and what they want, and (4) what data and systems exist.\n\nThe output is not a feature list. It is a clear problem statement, a baseline number, and a map of the people, data and constraints.",
    why: "Customers usually describe a solution (“we want a chatbot”) rather than the problem (“new staff can't find the right policy, so each ticket takes 20 minutes longer”). If you build the solution they named, you often solve the wrong problem. Discovery is where you find the real one.",
    how: [
      "**Book 45–60 minutes with the people who do the work,** not only their managers. Managers describe the process as it should be; the people doing it describe how it actually is.",
      "**Ask “last time” questions.** “Walk me through the last claim you processed, from the moment it arrived.” A specific recent case gives real steps, tools and delays. A general question gets an idealised answer.",
      "**Ask for numbers at each step.** How many per week? How long does each take? How often does it go wrong, and what does a mistake cost?",
      "**Ask “why” until you reach the root cause.** “Why does that step take 20 minutes?” → “Because I have to search three systems.” → “Why three?” → “Because policy documents were never migrated.”",
      "**Watch them do it if you can (“shadowing”).** People forget the workarounds they use every day.",
      "**Ask about data and access.** Where does each input live? Who owns it? Can we get a sample this week?",
      "**End with the success question:** “In 90 days, if this worked, what number would be different?”",
      "**Write it up the same day** and send it back: “Here's what I heard, is it correct?” This catches misunderstandings early and builds trust."
    ],
    example: "Weak question: “What features would you like in an AI assistant?” (gets a wish list)\n\nStrong question: “Show me the last three tickets you escalated. What were you looking for, where did you look, and how long did it take?” (gets the real workflow, the real systems and real timings)",
    pitfalls: [
      "Pitching the product during discovery. You stop listening and they start telling you what they think you want to hear.",
      "Only talking to the executive sponsor. Execs know the goal; users know the workflow.",
      "Leaving without numbers. Without a baseline, you can never prove impact later.",
      "Accepting “everything is a priority”. Make them rank the problems."
    ] },

  { type: "concept", tag: "Concept 3", h: "Baseline and success metric",
    what: "The **baseline** is how the process performs today, measured in numbers (for example: 25 minutes per claim, 8% rework rate). The **success metric** is the one number that should improve if your project works, with a target (for example: under 10 minutes per claim).\n\nYou usually also define one or two **guardrail metrics**. These are numbers that must NOT get worse while you improve the main one (for example: accuracy must not drop).",
    why: "The metric is what everything else hangs on. It tells you what to build first, gives you grounds to say no to requests that don't serve it, and at the end it proves your value to the executive who pays for the renewal. “Users liked it” does not renew a contract. “Handling time dropped from 25 to 9 minutes, which saves 2.1 FTE” does.",
    how: [
      "**Choose a number the business already cares about:** time, cost, error rate, revenue, backlog, customer satisfaction (CSAT).",
      "**Measure the baseline before you build anything.** Use system logs (ticket timestamps), a time study (time 20 real cases) or existing reports.",
      "**Set a target with the sponsor:** a specific value and a date.",
      "**Add a guardrail** so you can't “win” by breaking something else (faster but wrong).",
      "**Agree how it will be measured.** Which data source? Who calculates it? How often?"
    ],
    table: { cols: ["Type", "Example", "Why you need it"], rows: [
      ["Primary metric", "Median claim handling time: 25 min → < 10 min by end of Q2", "Defines success; drives priorities"],
      ["Guardrail metric", "Field accuracy ≥ 92% (today's human rework rate is 8%)", "Stops you optimising speed by sacrificing quality"],
      ["Adoption metric", "≥ 70% of adjusters use it weekly", "A great tool nobody uses has no impact"],
      ["Leading indicator", "Share of drafts accepted with minor edits", "Moves early, before the business metric shows it"]
    ] },
    pitfalls: [
      "Vanity metrics: “number of questions answered”, “tokens processed”. These measure activity, not value.",
      "Too many metrics. With five “primary” metrics you have none.",
      "No baseline. You cannot claim improvement over a number you never measured.",
      "Model metrics only (“95% accuracy”). Executives want business metrics; accuracy is a guardrail."
    ] },

  { type: "concept", tag: "Concept 4", h: "Scoping and the thin slice",
    what: "**Scoping** means deciding exactly what you will build first and, just as important, what you will not build. A **thin slice** (also called a vertical slice) is a narrow piece of functionality that works end to end, from real input to real output in the user's hands, so you can measure it.",
    analogy: "Cut a cake vertically and you get every layer (sponge, cream, icing) in a small piece you can taste. Cut it horizontally and you get only the sponge layer across the whole cake, and you can't tell yet whether the cake is any good.",
    why: "Big-bang projects (“build the whole platform, then launch”) take months before anyone sees value, and they fail in ways you only discover at the end. A thin slice delivers value in weeks, exposes the hard problems (data quality, access, adoption) early, and earns you the trust needed for the next slice.",
    how: [
      "**List the candidate problems** you found in discovery.",
      "**Score each one on value** (how much would it move the metric?) and **feasibility** (is the data available? is the risk low? can we do it in 2–6 weeks?).",
      "**Pick the high-value, high-feasibility one.** Often it is the most frequent case type, not the most interesting one.",
      "**Narrow it further:** one document type, one team, one language, one region.",
      "**Write the out-of-scope list explicitly** and get the sponsor to agree to it in writing.",
      "**Define exit criteria:** what result lets you move to the next slice or to production."
    ],
    table: { cols: ["", "Horizontal (avoid)", "Vertical thin slice (do this)"], rows: [
      ["What gets built", "The whole ingestion layer for all 40 document types", "Ingestion + extraction + review screen for the #1 document type only"],
      ["First value to a user", "Month 4+", "Week 3–4"],
      ["Can you measure impact early?", "No", "Yes, on that one document type"],
      ["Risks discovered", "Late", "Early (bad scans, missing access, user resistance)"]
    ] },
    pitfalls: [
      "Picking the most technically exciting problem instead of the most valuable one.",
      "Keeping out-of-scope items in your head instead of in writing. They come back as “but you promised”.",
      "Making the slice so thin that it no longer moves any metric."
    ] },

  { type: "concept", tag: "Concept 5", h: "The one-page spec",
    what: "A short written agreement between you and the customer about the first slice: the problem, who it is for, how success is measured, what is in and out of scope, what data you need, the constraints, the risks, and the milestones. It fits on one page so that executives actually read it.",
    why: "Verbal agreements drift. Six weeks in, different stakeholders will remember different promises. A signed-off spec settles scope arguments (“that's on the out-of-scope list we agreed on 3 March”), aligns engineering with the business, and is your first artefact as the trusted technical lead.",
    how: [
      "Draft it within 2–3 days of discovery while details are fresh.",
      "Review it with your champion first (the person on the customer side who wants this to succeed), then the sponsor.",
      "Get explicit sign-off (an email saying “approved” is enough).",
      "Update it when scope changes, and keep a short change log at the bottom."
    ],
    table: { cols: ["Section", "Filled-in example (insurance claims)"], rows: [
      ["Problem", "Adjusters spend ~25 min per claim reading 30–80 pages of attachments to fill a 12-field summary; 4,000 claims/month; 8% of summaries need rework."],
      ["Users & workflow", "40 motor-claims adjusters in the UK team. The tool pre-fills the summary form in the existing claims system; the adjuster reviews and submits."],
      ["Success metric", "Primary: median handling time 25 → under 10 min. Guardrail: field accuracy ≥ 92%. Adoption: ≥ 70% weekly use."],
      ["In scope", "Motor claims, English, PDF and scanned attachments, 12 summary fields with page citations."],
      ["Out of scope", "Claim approval decisions, fraud scoring, email ingestion, property claims (candidates for phase 2)."],
      ["Data & access", "Read-only API to the claims system; 200 anonymised historical claims for evaluation; owner: Claims Ops data team."],
      ["Constraints", "Azure UK South only; SSO via Entra ID; no customer PII in logs; security review takes about 3 weeks."],
      ["Risks", "Scan quality (owner: us, test by week 1); adjuster adoption (owner: Claims Ops lead, training plan by week 3)."],
      ["Milestones", "Week 2 demo on real claims → week 6 pilot with 8 adjusters → week 10 production decision, if the metric and guardrail are met."]
    ] },
    pitfalls: [
      "Writing ten pages. Nobody reads them.",
      "Missing the out-of-scope section. It is the most useful part.",
      "No owners or dates on risks. A risk with no owner doesn't get handled."
    ] },

  { type: "concept", tag: "Concept 6", h: "Demo vs POC vs pilot vs production",
    what: "Four stages of maturity that customers (and interviewers) often mix up:\n\n**Demo:** shows what is possible, usually driven by you, on a small, fixed dataset. **Proof of concept (POC):** answers one technical question (“can we extract these fields from scanned PDFs with ≥ 90% accuracy?”). **Pilot:** real users doing real work with the system in their environment for a limited period, measured against the baseline. **Production:** everyone who needs it uses it, with support, monitoring, security sign-off and an owner.",

__modA(2, "Production Python", "The Python you ship to customers: type hints, how async really works, packaging, FastAPI, and testing, each explained from first principles with runnable examples.", [
  { type: "visual", h: "What happens when a request hits an async FastAPI service", tag: "Visual", caption: "One worker process runs one event loop that juggles many requests. While one request waits on the database or an LLM, the loop serves others. Anything that blocks the loop (sync I/O or heavy CPU work) freezes every request on that worker.", mermaid: `
flowchart LR
  C[Client] --> U["Uvicorn worker<br/>(one event loop)"]
  U --> M["Middleware<br/>auth, request-id, timing"]
  M --> V["Pydantic validates<br/>the JSON body"]
  V --> D["Depends() builds<br/>db session, user, settings"]
  D --> H["async def handler"]
  H -->|"await (loop is free meanwhile)"| IO1[("Postgres")]
  H -->|"await gather (in parallel)"| IO2["LLM API"]
  H --> R["Response model<br/>serialised to JSON"]
  R --> C
  H -.->|"CPU-heavy or sync library"| P["thread pool / process pool / queue"]
` },

  { type: "concept", tag: "Concept 1", h: "Type hints and static type checking",
    what: "Type hints are annotations that say what type a variable, parameter or return value should be, for example `def total(prices: list[float]) -> float`. Python itself **ignores them at runtime**. A separate tool (a type checker such as `mypy` or `pyright`) reads your code without running it and reports mismatches.",
    why: "In a customer codebase, other people (and you, six months later) must understand and change your code safely. Type hints document intent, let the IDE autocomplete, and catch whole classes of bugs before deployment, like passing `None` where a string is required. In interviews, typed code signals production experience.",
    how: [
      "Annotate function parameters and return types: `def get_user(user_id: int) -> User | None:`.",
      "Use built-in generics: `list[str]`, `dict[str, int]`, `tuple[int, int]`.",
      "Use `X | None` (older style: `Optional[X]`) when a value can be missing. The checker then forces you to handle `None`.",
      "Use `TypedDict` to describe the shape of a plain dict, and `Protocol` to describe “anything with these methods” (duck typing).",
      "Run `mypy --strict src/` or `pyright` in CI so type errors fail the build."
    ],
    code: `
from typing import Protocol, TypedDict


class Invoice(TypedDict):            # describes a dict's keys and value types
    number: str
    total: float


class Summariser(Protocol):          # any class with this method "fits", no inheritance needed
    def summarise(self, text: str) -> str: ...


def find_invoice(invoices: list[Invoice], number: str) -> Invoice | None:
    for inv in invoices:
        if inv["number"] == number:
            return inv
    return None


inv = find_invoice([], "INV-1")
print(inv["total"])                  # mypy: error — "inv" might be None. Handle it first:
if inv is not None:
    print(inv["total"])              # OK
`,
    example: "Type hints vs Pydantic: type hints are checked **before** running (static). Pydantic models are checked **while** running (runtime): they validate incoming JSON and raise an error if a field is missing or has the wrong type. Use type hints everywhere, and Pydantic at the edges where untrusted data enters (API requests, LLM outputs, config files).",
    pitfalls: [
      "Coming from C#: hints are not enforced. `def f(x: int)` will happily accept `\"hello\"` at runtime unless a checker or Pydantic catches it.",
      "Using `Any` everywhere switches checking off. Use it only at genuinely untyped boundaries.",
      "Writing hints but never running a checker in CI, so they slowly become wrong."
    ] },

  { type: "concept", tag: "Concept 2", h: "How async/await actually works",
    what: "`async`/`await` lets one thread handle many tasks that spend most of their time **waiting** (for the network, a database, an LLM API). A function defined with `async def` is a **coroutine**: calling it returns an object that can be paused and resumed. `await` means “pause me here until this finishes, and let the **event loop** run other coroutines meanwhile”.\n\nThe **event loop** is a scheduler running in a single thread. It keeps a list of coroutines that are ready to continue and runs them one at a time, each until its next `await`.",
    analogy: "One waiter (the event loop) serves 20 tables. After taking an order they don't stand at the kitchen waiting for the food. They go and take other orders, and come back when the kitchen rings the bell (the I/O completes). One waiter can serve many tables because most of the time is spent waiting on the kitchen, not walking.",
    why: "LLM applications are mostly waiting: an LLM call takes 1–10 seconds, a vector search 50 ms, a database query 5 ms. With synchronous code, each worker handles one request at a time, so waiting time is wasted. With async, one worker can have hundreds of requests in flight. You also need async to call several things at once, such as 5 retrievers in parallel instead of one after another.",
    how: [
      "Your handler calls `await client.get(url)`. The HTTP library sends the request and tells the loop: “wake me when the response arrives”.",
      "The coroutine pauses. The loop picks the next ready coroutine (maybe another user's request) and runs it until that one hits an `await`.",
      "When the operating system reports that the response bytes arrived, the loop marks the first coroutine as ready.",
      "On its next turn, the loop resumes the first coroutine exactly where it paused, with the response as the result of `await`.",
      "**Concurrency ≠ parallelism:** only one coroutine runs Python code at any instant. Async speeds up waiting, not computing."
    ],
    code: `
import asyncio, time


async def call_llm(name: str) -> str:
    await asyncio.sleep(1)          # stands in for a 1-second network call
    return f"{name} done"


async def sequential() -> None:
    start = time.perf_counter()
    for n in ["a", "b", "c"]:
        await call_llm(n)           # waits for each before starting the next
    print(f"sequential: {time.perf_counter() - start:.1f}s")   # ~3.0s


async def concurrent() -> None:
    start = time.perf_counter()
    results = await asyncio.gather(call_llm("a"), call_llm("b"), call_llm("c"))
    print(results, f"concurrent: {time.perf_counter() - start:.1f}s")  # ~1.0s


asyncio.run(sequential())
asyncio.run(concurrent())
`,
    pitfalls: [
      "Calling an `async def` without `await` just creates a coroutine object; nothing runs. Python warns: “coroutine was never awaited”.",
      "C# difference: .NET `Task`s run on a thread pool and can be truly parallel. Python coroutines all share one thread, so CPU-heavy code blocks everything.",
      "Async does not make CPU work (parsing a 500-page PDF, running a local model) faster. Use processes or a job queue for that."
    ] },

  { type: "concept", tag: "Concept 3", h: "Blocking the event loop (the #1 async bug)",
    what: "“Blocking the loop” means running code inside an `async def` that doesn't `await` but still takes a long time, for example `time.sleep(2)`, `requests.get(...)`, a synchronous database driver, or heavy CPU work. While that code runs, the event loop is stuck and cannot switch to any other request.",
    why: "It turns your concurrent server into a sequential one without any error message. Under load, latency explodes: if one request blocks for 2 seconds, the 20 requests queued behind it each wait 2 more seconds. This is one of the most common production incidents in FastAPI services.",
    how: [
      "**Detect it:** p95 latency jumps sharply when several users arrive together, while CPU sits low. Enable asyncio debug mode (`PYTHONASYNCIODEBUG=1`) to log callbacks that took longer than 100 ms.",
      "**Fix 1: use an async library:** `httpx.AsyncClient` instead of `requests`, `asyncpg` or async SQLAlchemy instead of `psycopg2`, the provider's async SDK client.",
      "**Fix 2: move sync code to a thread:** `await asyncio.to_thread(sync_function, arg)` runs it in a worker thread while the loop stays free.",
      "**Fix 3: declare the route with plain `def`:** FastAPI automatically runs `def` routes in a thread pool (about 40 threads by default).",
      "**Fix 4: CPU-heavy work:** send it to a process pool or a background job queue (Celery, RQ, Arq, a cloud queue) and return a job ID."
    ],
    code: `
import asyncio
import requests                      # synchronous HTTP library
from fastapi import FastAPI

app = FastAPI()


@app.get("/bad")
async def bad():
    r = requests.get("https://example.com")     # BLOCKS the loop for the whole call
    return {"status": r.status_code}


@app.get("/fixed-thread")
async def fixed_thread():
    r = await asyncio.to_thread(requests.get, "https://example.com")   # runs in a thread
    return {"status": r.status_code}


@app.get("/fixed-sync-route")
def fixed_sync_route():               # plain def -> FastAPI runs it in its thread pool
    r = requests.get("https://example.com")
    return {"status": r.status_code}
`,
    pitfalls: [
      "Vendor SDKs that look async but call sync code internally. Read the source or measure.",
      "`asyncio.to_thread` for CPU-heavy Python work only partly helps, because of the GIL. Use processes for that."
    ] },

  { type: "concept", tag: "Concept 4", h: "Running many things at once safely: gather, TaskGroup, Semaphore, timeouts",
    what: "Four tools for controlled concurrency:\n\n`asyncio.gather(*coros)` runs coroutines concurrently and returns their results in order. `asyncio.TaskGroup` (Python 3.11+) does the same, but if one task fails it **cancels the others** and raises; this is called structured concurrency. `asyncio.Semaphore(n)` is a counter that lets at most `n` coroutines into a block at once. `asyncio.timeout(seconds)` cancels anything that takes too long.",
    why: "FDE systems constantly fan out: summarise 200 documents, call 5 tools, query 3 indexes. Unbounded fan-out gets you rate-limited (HTTP 429) by the LLM provider or overloads the customer's API. Missing timeouts leave requests hanging forever when a dependency stalls.",
    how: [
      "Wrap each downstream call in `async with semaphore:` so no more than N run at once.",
      "Put a timeout on every network call, either in the client config or with `asyncio.timeout`.",
      "Decide on failure behaviour: fail the whole batch (TaskGroup) or return per-item errors (gather + try/except in each task).",
      "Create one shared HTTP client for the whole app (connection pooling), not one per request."
    ],
    code: `
import asyncio
import httpx

SEM = asyncio.Semaphore(8)                    # at most 8 calls in flight


async def summarise(client: httpx.AsyncClient, doc_id: str) -> dict:
    async with SEM:                           # waits here if 8 are already running
        try:
            async with asyncio.timeout(15):   # cancel if slower than 15 s
                r = await client.post("https://llm.internal/summarise", json={"id": doc_id})
                r.raise_for_status()
                return {"doc_id": doc_id, "summary": r.json()["text"]}
        except (httpx.HTTPError, TimeoutError) as e:
            return {"doc_id": doc_id, "error": type(e).__name__}   # per-item failure


async def summarise_all(doc_ids: list[str]) -> list[dict]:
    async with httpx.AsyncClient() as client:
        return await asyncio.gather(*(summarise(client, d) for d in doc_ids))

# 200 docs -> 200 coroutines created, but only 8 ever call the API at the same time
`,
    pitfalls: [
      "Plain `gather` without `return_exceptions=True` raises the first error but does NOT cancel the other tasks. They keep running in the background.",
      "A semaphore only limits within one process. With 4 workers × 8 = 32 concurrent calls, a shared limit needs Redis or a queue."
    ] },

  { type: "concept", tag: "Concept 5", h: "Packaging and dependencies: pyproject.toml, virtual environments, lock files",
    what: "A **virtual environment** is an isolated folder of installed packages for one project, so projects don't break each other. `pyproject.toml` is the single standard file that describes your project: its name, Python version, dependencies and tool settings. A **lock file** (`uv.lock`, `poetry.lock`) records the exact version of every package, including sub-dependencies, so every install is identical.\n\n`uv` is a fast modern tool that manages all three.",
    why: "“Works on my machine” is not acceptable at a customer. Their CI, their Docker build and their colleague's laptop must install exactly the same versions. Without a lock file, a dependency released tonight can break tomorrow's deployment.",
    how: [
      "`uv init myservice` creates `pyproject.toml` and the project layout.",
      "`uv add fastapi httpx pydantic-settings` adds runtime dependencies and updates the lock file.",
      "`uv add --dev pytest mypy ruff` adds development-only tools.",
      "`uv sync` creates `.venv` and installs exactly what the lock file says. Run it in CI and Docker.",
      "`uv run pytest` runs a command inside the project's environment.",
      "Commit both `pyproject.toml` and `uv.lock`."
    ],
    code: `
# pyproject.toml
[project]
name = "claims-extractor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [            # ranges here; exact pins live in uv.lock
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "mypy>=1.11", "ruff>=0.6"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
`,
    example: "Recommended layout (the “src layout”): `src/claims_extractor/` for code, `tests/` for tests, `pyproject.toml` and `uv.lock` at the root. The src layout stops tests from accidentally importing your local folder instead of the installed package.",
    pitfalls: [
      "Installing packages globally with `pip install` outside a virtual environment.",
      "Not committing the lock file.",
      "Pinning exact versions in a library's `pyproject.toml`: that causes conflicts for whoever depends on it. Pin exact versions only via the lock file of an application."
    ] },

  { type: "concept", tag: "Concept 6", h: "FastAPI essentials: models, dependency injection, lifespan, errors, settings",
    what: "FastAPI is a Python web framework. You declare endpoints as functions, and FastAPI reads your type hints to validate input, convert it into Python objects, generate OpenAPI docs (at `/docs`) and serialise responses.\n\nKey parts: **Pydantic models** define request and response bodies. **`Depends()`** is dependency injection: FastAPI calls a provider function and passes its result into your handler (for example a database session or the current user). **Lifespan** runs setup code at startup and cleanup at shutdown. **`HTTPException`** returns proper error codes.",
    why: "Most FDE deliverables expose an API: a webhook receiver, an extraction service, an agent endpoint. FastAPI gives you validation, docs and async support with little code. Using DI and lifespan correctly makes the service testable and efficient.",
    how: [
      "The request arrives, and FastAPI matches the path and method to your function.",
      "Path and query parameters are parsed from the URL; the JSON body is validated against your Pydantic model. Invalid input gets an automatic 422 response with details.",
      "Each `Depends(...)` provider runs (and can itself depend on other providers). Providers that `yield` can run cleanup after the response, such as closing a DB session.",
      "Your handler runs and returns an object, which FastAPI validates against `response_model` and turns into JSON.",
      "Settings come from environment variables via `pydantic-settings`, so the same code runs in dev, staging and prod."
    ],
    code: `
from contextlib import asynccontextmanager
from typing import Annotated

import httpx
from fastapi import Depends, FastAPI, HTTPException, Request
from pydantic import BaseModel, Field
from pydantic_settings import BaseSettings


class Settings(BaseSettings):            # reads LLM_URL, API_KEY from environment variables
    llm_url: str
    api_key: str


class ExtractIn(BaseModel):
    document_id: str = Field(min_length=1)


class ExtractOut(BaseModel):
    document_id: str
    fields: dict[str, str]


@asynccontextmanager
async def lifespan(app: FastAPI):
    app.state.settings = Settings()
    app.state.http = httpx.AsyncClient(timeout=20)   # one pooled client, created once
    yield                                            # the app serves requests here
    await app.state.http.aclose()                    # runs at shutdown


app = FastAPI(lifespan=lifespan)


def get_http(request: Request) -> httpx.AsyncClient:
    return request.app.state.http


def get_current_user(request: Request) -> str:       # real version: validate a JWT
    user = request.headers.get("x-user")
    if not user:

  { type: "concept", tag: "Concept 2", h: "Authentication, authorisation, tokens and JWTs",

  "aud": "api://claims-extractor",                               # audience: which API it is FOR
  "sub": "AAAAAAAAAAAAAAAAAAAAAIkzqFVrSaSaFHy782bbtaQ",           # subject: stable user id
  "exp": 1767225600,                                             # expiry (Unix seconds)
  "nbf": 1767222000,                                             # not valid before
  "scp": "claims.read claims.write",                             # scopes granted

  { type: "concept", tag: "Concept 3", h: "OAuth 2.0 flows: Authorization Code + PKCE and Client Credentials",
    what: "**OAuth 2.0** is the standard way for an app to get an access token to call an API on behalf of a user (delegated access) or on its own behalf. It defines “flows” (grant types). You need two of them.\n\n**Authorization Code + PKCE:** a user is present and logs in through the customer's identity provider (IdP). **Client Credentials:** no user; your backend service authenticates as itself (for example a nightly sync job).",

      "**10–12:** Validate the ID token, create the user's session, and call APIs with the access token.",

    what: "A webhook is an HTTP request that **another system sends to you** when something happens, for example “ticket created” or “payment succeeded”. Instead of you polling their API every minute, they call your URL. It's sometimes called a “reverse API”.",
    why: "Webhooks give near-real-time integrations without wasteful polling. But your endpoint is public on the internet, providers retry failed deliveries, and events can arrive twice or out of order. A naive handler creates duplicate records or accepts forged events.",
    how: [
      "**Verify the signature.** The provider signs each request with a shared secret, usually HMAC-SHA256 over the raw body plus a timestamp, and sends it in a header. Recompute the HMAC with your copy of the secret and compare in constant time. A mismatch means it's forged, so reject with 401.",

import hashlib, hmac, time
from fastapi import FastAPI, Header, HTTPException, Request

app = FastAPI()
SECRET = b"from-key-vault"


def valid_signature(raw: bytes, sig: str, ts: str) -> bool:
    if abs(time.time() - int(ts)) > 300:                        # older than 5 min: replay?
        return False
    expected = hmac.new(SECRET, ts.encode() + b"." + raw, hashlib.sha256).hexdigest()
    return hmac.compare_digest(expected, sig)                   # constant-time comparison


@app.post("/webhooks/tickets", status_code=202)
async def ticket_webhook(request: Request,
                         x_signature: str = Header(), x_timestamp: str = Header()):
    raw = await request.body()                                  # RAW bytes, not re-serialised JSON
    if not valid_signature(raw, x_signature, x_timestamp):
        raise HTTPException(401, "bad signature")
    event = await request.json()
    inserted = await db_insert_if_new(event["id"])              # UNIQUE(event_id) in the database
    if inserted:
        await queue.enqueue("process_ticket_event", event)      # heavy work happens elsewhere
    return {"received": True}

        for ticket in page["items"]:
            yield ticket
        if not page.get("next_cursor"):
            break                                     # no more pages
        params = {"limit": 100, "cursor": page["next_cursor"]}

  { type: "concept", tag: "Concept 7", h: "Retries with exponential backoff and jitter",
    what: "A **retry** repeats a failed request. **Exponential backoff** waits longer after each failure (for example 0.5 s, 1 s, 2 s, 4 s). **Jitter** randomises each wait so that many clients don't retry at the same instant.",
    why: "Networks and services fail briefly all the time: a pod restarts, a gateway times out, you hit a rate limit. Without retries your integration breaks on every blip. With naive retries (instant, forever, on every error) you make outages worse by hammering a struggling service. That's called a **retry storm**.",
    how: [
      "**Retry only transient errors:** connection errors, timeouts, 429, 502, 503, 504. Never 400/401/403/404/422, because the same request will fail again.",
      "**Only retry operations that are safe to repeat** (GET, PUT, DELETE, or POST with an idempotency key).",
      "**Wait with backoff:** `delay = random.uniform(0, min(cap, base × 2^attempt))`. This is “full jitter”. With base 0.5 s the maximum waits are 1 s, 2 s, 4 s, 8 s…",
      "**Honour `Retry-After`:** if the server says “wait 30 seconds”, wait 30 seconds.",
      "**Cap attempts** (for example 5) and total time. Then fail loudly: log, alert, or send to a dead-letter queue."
    ],
    code: `
import asyncio, random
import httpx

RETRYABLE_STATUS = {429, 502, 503, 504}


async def request_with_retry(client: httpx.AsyncClient, method: str, url: str,
                             max_attempts: int = 5, base: float = 0.5, cap: float = 20.0, **kw):
    for attempt in range(1, max_attempts + 1):
        retry_after = None
        try:
            resp = await client.request(method, url, **kw)
            if resp.status_code not in RETRYABLE_STATUS:
                return resp                            # success or a non-retryable error
            retry_after = resp.headers.get("Retry-After")
        except (httpx.ConnectError, httpx.ReadTimeout):
            pass                                       # transient network problem
        if attempt == max_attempts:
            raise RuntimeError(f"{method} {url} failed after {attempt} attempts")
        if retry_after and retry_after.isdigit():
            delay = float(retry_after)                 # server told us how long
        else:
            delay = random.uniform(0, min(cap, base * 2 ** attempt))   # full jitter
        await asyncio.sleep(delay)
`,
    pitfalls: [
      "Retrying at every layer (client, SDK, gateway, service), so one failure turns into 5 × 5 × 5 = 125 calls.",
      "No jitter: 1,000 clients that failed together all retry at exactly 1 s, 2 s, 4 s and knock the service over again."
    ] },

  { type: "concept", tag: "Concept 8", h: "Idempotency and idempotency keys",
    what: "An operation is **idempotent** if repeating it has the same effect as doing it once. An **idempotency key** is a unique ID the client sends with a non-idempotent request (usually a POST) so the server can recognise a repeat and return the original result instead of doing the work again.",
    why: "Retries (Concept 7) and at-least-once webhooks (Concept 5) mean the same request WILL arrive twice. Without idempotency: two refunds, two tickets, two emails to the customer's customer. This is one of the most common integration bugs.",
    how: [
      "The client generates a unique key per logical operation, for example a UUID, or better a deterministic one like `refund-{order_id}-{attempt_group}`, and sends it as `Idempotency-Key: ...`.",
      "The server looks up the key. **Not seen:** it stores the key with status “in progress”, does the work, then stores the result against the key.",
      "**Seen and finished:** it returns the stored result without doing the work again.",
      "**Seen and still in progress:** it returns 409, and the client retries later.",
      "Keys expire after a sensible window (for example 24 hours)."
    ],
    example: "Timeline without a key: POST /refunds → the refund is created → the response is lost to a network timeout → the client retries → **a second refund is created**. With a key: the retry carries the same key → the server finds the stored result → it returns the first refund → **exactly one refund**.",
    pitfalls: [
      "Generating a new key on each retry. Then it's useless.",
      "Storing the key in a different transaction from the work, so a crash between them leaves them inconsistent. Do both in one DB transaction where possible."
    ] },

  { type: "concept", tag: "Concept 9", h: "Rate limits",

    why: "Bulk jobs such as a backfill of 2 million records or summarising 50,000 documents will hit limits. If you ignore them, the job fails halfway, or the customer's API gets overloaded and their admins block your integration.",
    how: [
      "Read the provider's documentation for limits per endpoint, per user, per app and per tenant.",
      "**Throttle on the client side** so you never exceed the limit. A token bucket works well: tokens refill at the allowed rate and each request spends one.",

      "For big jobs, use a queue with a fixed number of workers and a known rate, and make the job **resumable** (checkpoint the cursor) so a failure doesn't restart from zero.",

  { type: "visual", h: "From messy customer exports to a trusted data model", tag: "Visual", caption: "Raw data is stored exactly as received. A staging layer cleans it. Good rows go to the core model, bad rows go to quarantine with a reason. Every concept below maps to one of these boxes.", mermaid: `

  { type: "concept", tag: "Concept 1", h: "SQL joins, grouping and CTEs",
    what: "A **join** combines rows from two tables using a matching column. A **GROUP BY** collapses rows into groups and computes aggregates (count, sum, average) per group. A **CTE** (Common Table Expression, `WITH name AS (...)`) is a named sub-query that makes long queries readable, step by step.",
    why: "As an FDE you constantly answer questions about customer data (“how many tickets per product last month?”, “which customers have no orders?”) and build the queries behind pipelines and dashboards. Interviewers test this directly.",
    example: "Two small tables: **customers** (1 Ana, 2 Ben, 3 Cy) and **orders** (id 10 → customer 1, total 50; id 11 → customer 1, total 30; id 12 → customer 2, total 20). Cy has no orders.",
    table: { cols: ["Join type", "Returns", "Result on the example"], rows: [
      ["`INNER JOIN`", "Only rows with a match in both tables", "Ana-10, Ana-11, Ben-12 (Cy disappears)"],
      ["`LEFT JOIN`", "All rows from the left table; NULLs where no match", "Ana-10, Ana-11, Ben-12, Cy-NULL"],
      ["Anti-join (`NOT EXISTS`)", "Left rows with NO match", "Cy"],
      ["`GROUP BY` customer with `SUM(total)`", "One row per group", "Ana 80, Ben 20 (Cy 0 with a LEFT JOIN + COALESCE)"]
    ] },
    code: `
-- Revenue per customer, including customers with no orders, only customers with > 1 order
WITH customer_orders AS (
  SELECT c.id, c.name, COUNT(o.id) AS order_count, COALESCE(SUM(o.total), 0) AS revenue
  FROM customers c
  LEFT JOIN orders o ON o.customer_id = c.id
  GROUP BY c.id, c.name
)
SELECT * FROM customer_orders
WHERE order_count > 1              -- filter on groups (same as HAVING COUNT(o.id) > 1)
ORDER BY revenue DESC;

-- Customers who never ordered (anti-join)
SELECT c.* FROM customers c
WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);
`,
    pitfalls: [
      "Putting a filter on the right table in `WHERE` after a LEFT JOIN (`WHERE o.status = 'paid'`) silently turns it into an inner join. Put it in the `ON` clause instead.",
      "Using `COUNT(*)` with a LEFT JOIN counts the NULL row as 1. Use `COUNT(o.id)`.",
      "`NOT IN (subquery)` returns nothing if the subquery contains a NULL. Prefer `NOT EXISTS`."
    ] },

  { type: "concept", tag: "Concept 2", h: "Window functions",
    what: "A window function computes a value **for each row** using a set of related rows (the “window”), **without collapsing rows** the way GROUP BY does. The syntax is `function() OVER (PARTITION BY ... ORDER BY ...)`. `PARTITION BY` splits rows into groups; `ORDER BY` orders rows within each group.",
    why: "They solve the most common analytics and data-cleaning tasks in one pass: latest record per customer, deduplication, running totals, time since the previous event, ranking. These come up in interviews all the time.",
    example: "Tickets for customer 1 created on Jan 1, Jan 5 and Jan 12. The query below adds `rn` (1 = newest) and `days_since_prev`:",
    table: { cols: ["customer_id", "created_at", "rn", "prev_created", "days_since_prev"], rows: [
      ["1", "Jan 12", "1", "Jan 5", "7"],
      ["1", "Jan 5", "2", "Jan 1", "4"],
      ["1", "Jan 1", "3", "NULL", "NULL"]
    ] },
    code: `
SELECT customer_id, created_at,
       ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC) AS rn,
       LAG(created_at) OVER (PARTITION BY customer_id ORDER BY created_at)   AS prev_created,
       created_at::date
         - (LAG(created_at) OVER (PARTITION BY customer_id ORDER BY created_at))::date AS days_since_prev,
       SUM(1) OVER (PARTITION BY customer_id ORDER BY created_at)            AS running_count
FROM tickets;

-- Latest ticket per customer: keep rn = 1
SELECT * FROM (
  SELECT t.*, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC) AS rn
  FROM tickets t
) x WHERE rn = 1;
`,
    how: [
      "`ROW_NUMBER()`: 1, 2, 3… within each partition. Use it for dedup and latest-per-group.",
      "`RANK()` / `DENSE_RANK()`: like ROW_NUMBER, but ties share a rank.",
      "`LAG(col)` / `LEAD(col)`: the value from the previous or next row.",
      "`SUM(col) OVER (... ORDER BY ...)`: a running total."
    ],
    pitfalls: [
      "You can't use a window result in `WHERE` of the same query. Wrap it in a subquery or CTE, as above.",
      "Forgetting a tie-breaker in `ORDER BY` (for example `, id`) makes “latest” nondeterministic when timestamps tie."
    ] },

  { type: "concept", tag: "Concept 3", h: "Indexes and reading EXPLAIN",
    what: "An **index** is a separate data structure that lets the database find rows without reading the whole table. Postgres's default is a **B-tree**: a sorted, balanced tree of the indexed column values, each pointing to its row.",
    analogy: "A phone book sorted by (last name, first name). Finding “Smith, Anna” is fast. Finding everyone named “Smith” is fast. Finding everyone named “Anna” regardless of last name is slow: you have to read the whole book. That's the **leftmost-prefix rule** for composite indexes.",
    why: "Customer datasets grow to millions of rows. A query that takes 5 ms with the right index can take 20 seconds without it, and that is often the entire latency problem in an app or pipeline.",
    how: [
      "Create one: `CREATE INDEX idx_tickets_customer_created ON tickets (customer_id, created_at DESC);`",
      "The index above helps `WHERE customer_id = 7`, and `WHERE customer_id = 7 AND created_at > '2026-01-01'`, and `ORDER BY created_at` within a customer. It does **not** help `WHERE created_at > ...` alone.",
      "Run `EXPLAIN (ANALYZE, BUFFERS) <query>` to see the plan and real timings. **Seq Scan** means the whole table is read. **Index Scan / Index Only Scan** means the index was used.",
      "Other index types: **GIN** for `jsonb` keys, arrays and full-text search; **partial indexes** (`WHERE status = 'open'`) for hot subsets; **expression indexes** (`ON lower(email)`) when you query with a function; **HNSW** (pgvector) for embeddings."
    ],
    code: `
EXPLAIN ANALYZE SELECT * FROM tickets WHERE lower(email) = 'ana@example.com';
--  Seq Scan on tickets  (actual time=0.02..812.4 rows=1 loops=1)
--    Filter: (lower(email) = 'ana@example.com')
--    Rows Removed by Filter: 2999999          <- read 3M rows to find 1

CREATE INDEX idx_tickets_email_lower ON tickets (lower(email));

EXPLAIN ANALYZE SELECT * FROM tickets WHERE lower(email) = 'ana@example.com';
--  Index Scan using idx_tickets_email_lower on tickets  (actual time=0.03..0.04 rows=1)
`,
    pitfalls: [
      "Every index slows down writes and uses disk. Don't index every column.",
      "Wrapping an indexed column in a function (`WHERE date(created_at) = ...`) prevents use of a plain index on that column.",
      "Low-selectivity columns (such as a boolean that's true for 50% of rows) rarely benefit from an index."
    ] },

  { type: "concept", tag: "Concept 4", h: "Transactions, ACID and isolation",
    what: "A **transaction** groups statements so they succeed or fail together: `BEGIN; ...; COMMIT;` (or `ROLLBACK;`). **ACID** is the set of guarantees: **Atomicity** (all or nothing), **Consistency** (constraints always hold), **Isolation** (concurrent transactions don't see each other's half-done work), **Durability** (committed data survives a crash).\n\nPostgres uses **MVCC** (multi-version concurrency control): writers create new row versions, and readers see a consistent snapshot, so readers never block writers.",
    why: "Pipelines and apps write several related rows at once (an order and its lines; a document and its chunks). Without transactions, a crash halfway leaves half-written data that's hard to find and fix.",
    table: { cols: ["Isolation level", "What it prevents", "Typical use"], rows: [
      ["Read Committed (Postgres default)", "Reading uncommitted data", "Most OLTP work"],
      ["Repeatable Read", "A row changing between two reads in your transaction", "Reports needing a stable snapshot"],
      ["Serializable", "All anomalies; behaves as if transactions ran one at a time (may abort with a serialization error you must retry)", "Money, inventory, strict invariants"]
    ] },
    code: `
BEGIN;
  INSERT INTO documents (id, source, status) VALUES ('doc-1', 'sharepoint', 'indexed');
  INSERT INTO chunks (doc_id, n, text) VALUES ('doc-1', 0, '...'), ('doc-1', 1, '...');
COMMIT;   -- both inserts become visible together, or (on error / ROLLBACK) neither does

-- Lost-update protection for "read then write" logic:
SELECT balance FROM accounts WHERE id = 7 FOR UPDATE;   -- locks the row until COMMIT
UPDATE accounts SET balance = balance - 50 WHERE id = 7;
`,
    pitfalls: [
      "Long-running transactions (for example one open across an LLM call) hold locks and stop Postgres from cleaning up old row versions (vacuum). Keep transactions short.",
      "Read-modify-write in application code without `FOR UPDATE` or an atomic `UPDATE ... SET x = x - 1` loses updates under concurrency."
    ] },

  { type: "concept", tag: "Concept 5", h: "Data modeling: normalisation, star schemas, history",
    what: "**Data modeling** means deciding which tables exist, what columns they have and how they relate. **Normalisation** stores each fact once (customer address in the customers table, not repeated in every order). A **star schema**, used for analytics, has a central **fact table** of events (orders, tickets) with foreign keys to **dimension tables** describing them (customer, product, date). **SCD Type 2** (slowly changing dimension) keeps the history of changing attributes by adding a new row with validity dates instead of overwriting.",
    why: "A good model makes queries simple and correct; a bad one makes every question a 200-line query with subtle double counting. FDEs often design the model that the customer's data is loaded into.",
    example: "Denormalised (problematic): each order row repeats `customer_name`, `customer_tier`, `customer_address`. If the customer moves, you have to update 500 rows, and missing one makes the data disagree with itself.\n\nNormalised: `customers(id, name, tier, address)` and `orders(id, customer_id, total, created_at)`. The address lives in exactly one place.\n\nSCD Type 2 for “what tier was the customer when they ordered?”:",
    table: { cols: ["customer_id", "tier", "valid_from", "valid_to", "is_current"], rows: [
      ["42", "Silver", "2025-01-01", "2026-03-31", "false"],
      ["42", "Gold", "2026-04-01", "9999-12-31", "true"]
    ] },
    how: [
      "Start from the questions and access patterns: what will be asked, and how often?",
      "Normalise operational data (the app's own tables) to roughly 3rd normal form.",
      "Denormalise deliberately for read-heavy paths (search documents, analytics marts, feature tables).",
      "Use SCD2 when historical accuracy matters (pricing, tiers, org structure). Join facts on `order_date BETWEEN valid_from AND valid_to`."
    ],
    pitfalls: [
      "Joining a fact table to a dimension that has several rows per key (for example several SCD2 versions without the date condition) multiplies rows and inflates sums.",
      "Using free-text columns for categories. You get “Gold”, “gold ” and “GOLD”."

  { type: "concept", tag: "Concept 6", h: "ETL vs ELT and pipeline layers",
    what: "**ETL** (extract → transform → load) cleans data in code before loading it. **ELT** (extract → load → transform) loads raw data first, then transforms it inside the database or warehouse with SQL (often using **dbt**). The modern default is ELT with layers: **raw** (exactly as received, never modified) → **staging** (cleaned and typed) → **core/marts** (business models).",
    why: "Keeping raw data untouched means that when you discover a cleaning bug in week 6, you fix the rule and re-run the transformations. You don't have to ask the customer to re-export everything. Layers also make it clear where a bad number came from.",
    how: [
      "**Extract:** pull from sources incrementally using a watermark (last `updated_at` seen), as in module 3.",
      "**Load raw:** append rows with metadata: `_source`, `_loaded_at`, `_file_name`, `_batch_id`.",
      "**Transform:** SQL or Python steps that are **idempotent** (running twice gives the same result, using upserts or delete-and-rebuild per batch).",
      "**Test:** row counts per layer, not-null and uniqueness checks, accepted values (dbt tests or Great Expectations).",
      "**Schedule and monitor:** an orchestrator (Airflow, Dagster, Prefect, Azure Data Factory, or cron to start with), with alerts on failures and on missing data."
    ],
    pitfalls: [
      "Overwriting raw data during cleaning.",
      "Non-idempotent loads (plain INSERT) that duplicate everything on re-run.",
      "No reconciliation: nobody can say whether 1,000,000 source rows became 1,000,000 or 987,000."
    ] },

  { type: "concept", tag: "Concept 7", h: "Cleaning messy customer data: a playbook",
    what: "Customer data is always messier than they say: duplicate records, inconsistent formats, free-text where there should be codes, broken encodings, missing values. Cleaning means turning it into consistent, validated data with a clear record of what was changed or rejected, and why.",
    why: "Garbage in, garbage out, and with LLMs the garbage comes out sounding confident. Many FDE projects are 60% data work. Doing it transparently (with quarantine and reconciliation) is also what makes the customer trust your numbers.",
    how: [
      "**Profile first.** For each column: row count, null %, distinct count, min/max, top 20 values. You'll find the problems before they find you.",
      "**Standardise formats:** trim whitespace, normalise case, Unicode-normalise text (NFKC), one date format (ISO 8601), phone numbers to E.164, currency amounts as numbers plus a separate currency code.",
      "**Map categories:** a mapping table from messy values to canonical codes (“GOLD”, “Gold ”, “gld” → `gold`), reviewed by the data owner.",
      "**Deduplicate:** first on a deterministic key (normalised email, tax ID), then fuzzy matching (name + address similarity) for the rest, with human review of borderline pairs.",

from datetime import date

class CustomerRow(BaseModel):
    email: EmailStr                               # requires pydantic[email]
    name: str = Field(min_length=1)
    country: str = Field(pattern=r"^[A-Z]{2}$")   # ISO 3166 alpha-2
    signup_date: date

    @field_validator("name")
    @classmethod
    def clean_name(cls, v: str) -> str:
        return " ".join(v.split()).title()        # collapse spaces, title-case

    @field_validator("country", mode="before")
    @classmethod
    def upper_country(cls, v: str) -> str:
        return v.strip().upper()


good, quarantine = [], []
for raw in rows:                                  # rows: list[dict] from the staging layer
    try:
        good.append(CustomerRow.model_validate(raw))
    except ValidationError as e:
        quarantine.append({"row": raw, "reason": e.errors()[0]["msg"]})
print(f"{len(good)} valid, {len(quarantine)} quarantined")
`,

__modA(5, "LLM engineering", "How LLMs behave as a component, prompting, structured outputs, tool use, embeddings, RAG step by step, vector databases, agents with LangGraph, and MCP, each explained from the mechanics up.", [
  { type: "visual", h: "Production RAG pipeline", tag: "Visual", caption: "Top half runs offline when documents change; bottom half runs for every question. Concepts 5–7 explain every box. Most quality problems come from parsing, chunking and retrieval, not from the LLM.", mermaid: `
