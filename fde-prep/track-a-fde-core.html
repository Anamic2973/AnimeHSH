<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE Core Track</title>
<style>
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-2: #f0f0ec;
  --text: #1c1c1e;
  --muted: #62646a;
  --border: #e0e0da;
  --accent: #2c55d6;
  --accent-soft: #e7edfc;
  --good: #17784a;
  --good-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe8e6;
  --warn-soft: #fdf3dc;
  --code-bg: #f2f2ee;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --surface: #1b1c1f; --surface-2: #232428; --text: #ececee; --muted: #a0a2a8;
    --border: #303137; --accent: #8aa8ff; --accent-soft: #1f2a4a; --good: #6fd39b; --good-soft: #16301f;
    --bad: #ff8a80; --bad-soft: #3a1d1b; --warn-soft: #3a3016; --code-bg: #232428;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --surface: #1b1c1f; --surface-2: #232428; --text: #ececee; --muted: #a0a2a8;
  --border: #303137; --accent: #8aa8ff; --accent-soft: #1f2a4a; --good: #6fd39b; --good-soft: #16301f;
  --bad: #ff8a80; --bad-soft: #3a1d1b; --warn-soft: #3a3016; --code-bg: #232428;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre code { overflow-wrap: normal; }
pre.code { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; line-height: 1.5; margin: 0; }
pre.code code { background: none; padding: 0; }
h1, h2, h3 { line-height: 1.25; letter-spacing: -0.01em; }
h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 0 0 10px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text); text-decoration: none; min-width: 0; }
.brand span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { background: var(--accent); color: var(--surface); border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
.top-progress { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.bar { width: 140px; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
.menu-btn { display: none; }

/* layout */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 55px); }
.side { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 10px 40px; position: sticky; top: 55px; height: calc(100vh - 55px); overflow-y: auto; }
.side h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 8px 6px; }
.side a.nav { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 7px; color: var(--text); text-decoration: none; font-size: 14px; }
.side a.nav:hover { background: var(--surface-2); }
.side a.nav.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side a.nav .st { width: 18px; flex: none; text-align: center; }
.side a.nav .sc { margin-left: auto; font-size: 11px; color: var(--muted); flex: none; }
.side a.nav.checkpoint { font-style: italic; }
.side .tracks a { display: block; padding: 4px 8px; font-size: 13px; }
main { padding: 28px 32px 80px; max-width: 980px; width: 100%; outline: none; }

/* blocks */
.block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin: 0 0 16px; box-shadow: var(--shadow); }
.block > h3 .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; margin-right: 8px; vertical-align: 2px; }
.block p { margin: 0 0 10px; }
.block p:last-child { margin-bottom: 0; }
.block ul, .block ol { margin: 0; padding-left: 22px; }
.block li { margin: 4px 0; }
.block.callout { background: var(--warn-soft); }
.block.csnote { border-left: 4px solid var(--accent); }
.hero { margin-bottom: 18px; }
.hero .kicker { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

figure.visual { margin: 0; }
figure.visual .diagram { overflow-x: auto; text-align: center; padding: 6px 0; }
figure.visual .diagram svg { max-width: 100%; height: auto; }
figure.visual pre.mermaid-src { text-align: left; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
.table-wrap { overflow-x: auto; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
td.chk { width: 32px; }
tr.solved td { color: var(--muted); }
tr.solved td a { color: var(--muted); text-decoration: line-through; }
.diff { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.diff.Easy { background: var(--good-soft); color: var(--good); }
.diff.Medium { background: var(--warn-soft); color: #9a6700; }
.diff.Hard { background: var(--bad-soft); color: var(--bad); }
:root[data-theme="dark"] .diff.Medium { color: #e3b341; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .diff.Medium { color: #e3b341; } }

/* quiz */
.q { padding: 14px 0; border-top: 1px solid var(--border); }
.q:first-of-type { border-top: 0; padding-top: 4px; }
.q-text { margin: 0 0 10px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 9px 12px; font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .letter { font-weight: 700; color: var(--muted); flex: none; }
.opt.correct { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.why { margin: 10px 0 0; font-size: 14px; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; }
.ok { color: var(--good); } .no { color: var(--bad); }
.quiz-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.score { font-weight: 600; }

/* controls */
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: inherit; background: var(--surface); color: var(--text); resize: vertical; }
.progress-block { white-space: pre-wrap; }

.roadmap { list-style: none; padding: 0 !important; margin: 0; }
.roadmap li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); margin: 0 !important; }
.roadmap li:last-child { border-bottom: 0; }
.roadmap .sc { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.cmds { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.cmds code { font-weight: 600; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .side { display: none; position: fixed; top: 55px; left: 0; right: 0; bottom: 0; height: auto; z-index: 15; border-right: 0; }
  body.nav-open .side { display: block; }
  main { padding: 20px 16px 60px; }
  .bar { width: 70px; }
  .block { padding: 16px; }
  figure.visual .diagram.wide svg { min-width: 620px; }
}

</style>
</head>

(function () {
  const mod = (num, title, summary, blocks) => ({ id: 'a' + num, num, title, short: 'A' + num, summary, kind: 'module', blocks });

  window.TRACK = {
    key: 'A', cmd: 'A', name: 'FDE Core', title: 'FDE Core Track', showSolved: false,
    intro: 'Ten modules, fixed order. Every module: concept visual → explanation → real FDE scenario → small hands-on task → 3 practice questions → quiz.\n\nWork one module per session. Tick **Mark module done** at the end, then copy the PROGRESS block into your next tutor session.',
    otherTracks: [['Track B — DSA', 'track-b-dsa.html'], ['Track C — System Design', 'track-c-system-design.html']],
    items: [

      // ───────────────────────── 1
      mod(1, 'The FDE role', 'Discovery, scoping, turning vague business problems into specs, demos, working inside customer environments.', [
        { type: 'visual', h: 'The FDE engagement loop', tag: 'Visual', caption: 'An FDE owns the whole loop from a vague ask to measured value, then loops the learnings back into the product team.', mermaid: `
flowchart LR
  A["Vague ask<br/>'We want AI for claims'"] --> B["Discovery<br/>users, workflow, data, pain"]
  B --> C["Scoping<br/>success metric, constraints, out-of-scope"]
  C --> D["Spec + demo<br/>thin slice on real data"]
  D --> E["Pilot inside<br/>customer env"]
  E --> F["Production<br/>hardening, handover"]
  F --> G["Measure<br/>metric vs baseline"]
  G -->|expand| C
  G -->|product feedback| H["Core product team"]
` },
        { type: 'text', h: 'What the job actually is', tag: 'Explain', body: 'A Forward Deployed Engineer is a software engineer embedded with a customer. You write production code, but your input is a business problem, not a ticket. The value you add is **reducing ambiguity**: turning "we want AI for X" into a scoped system that measurably moves a number the customer cares about.\n\nThree things separate an FDE from a regular SWE: (1) you own discovery — nobody hands you requirements; (2) you work inside someone else\'s constraints — their network, identity provider, data residency, change process; (3) you are the feedback channel from the field back to the product team, so you notice what should become a product feature instead of bespoke code.' },
        { type: 'list', h: 'Discovery — the questions that matter', tag: 'Explain', items: [
          '**Workflow:** walk me through the last time this happened, step by step. Who touches it? Where does it wait?',
          '**Pain in numbers:** how many per week, how long each, what does an error cost? This becomes your baseline.',
          '**Decision owner & users:** who signs off, who uses it daily, who loses if it works (hidden blockers).',
          '**Data:** where it lives, format, volume, quality, who grants access, PII / residency rules.',
          '**Constraints:** cloud, SSO, on-prem, approved models, security review timeline, budget per call.',
          '**Definition of done:** "If this works, in 90 days what number changed?" — insist on one primary metric.'
        ] },
        { type: 'table', h: 'One-page spec template', tag: 'Explain', cols: ['Section', 'What goes in it'], rows: [
          ['Problem', 'One paragraph in the customer\'s words + baseline number'],
          ['Users & workflow', 'Who, current steps, where the system slots in'],
          ['Success metric', 'Primary metric + target + how it is measured; 1–2 guardrail metrics'],
          ['Scope / out of scope', 'Thin slice first; explicitly list what you will NOT do'],
          ['Data & access', 'Sources, owners, access path, PII handling'],
          ['Constraints', 'Infra, security, compliance, latency, cost'],
          ['Risks & open questions', 'Each with an owner and a date'],
          ['Milestones', 'Demo → pilot → production, with exit criteria per stage']
        ] },
        { type: 'callout', h: 'Real FDE scenario', tag: 'Scenario', body: 'An insurer says: "We want GenAI for claims." Discovery reveals adjusters spend ~25 min per claim reading 30–80 pages of attachments to fill a 12-field summary form; 4,000 claims/month; errors cause re-work 8% of the time.\n\nScoped thin slice: **extract the 12 fields with citations to the source page**, adjuster reviews and edits (human-in-the-loop). Primary metric: handling time per claim (25 → <10 min). Guardrail: field-level accuracy ≥ baseline human re-work rate. Out of scope: automatic claim decisions, fraud scoring, email ingestion (phase 2). Demo in week 2 on 20 anonymised real claims — not synthetic data — because the demo must prove it works on *their* mess.' },
        { type: 'list', h: 'Hands-on task (30 min)', tag: 'Task', ordered: true, items: [
          'Pick a workflow at your current job that your agentic platform could improve.',
          'Write the one-page spec using the template above. Force yourself to a single primary metric with a number.',
          'Write the 3 things you are explicitly NOT building in the first slice, and why.',
          'Bring it to the tutor session — I will critique it like a customer\'s CTO would.'
        ] },
        { type: 'list', h: 'Practice questions', tag: 'Practice', ordered: true, items: [
          'A VP says "we need an AI agent that can do everything our ops team does". Give your first 5 discovery questions and the thin slice you would propose.',
          'Mid-pilot, the customer asks to add Slack, email and Teams ingestion "since it should be easy". How do you respond?',
          'Your demo works on sample data, but the customer\'s real PDFs are scanned images. What do you do in the next 48 hours?'
        ] },
        { type: 'quiz', qs: [
          ['What is the single most important output of discovery?', ['A list of every feature the customer wants', 'A baseline and a primary success metric the customer agrees to', 'A choice of LLM vendor', 'A Gantt chart'], 1, 'Without a baseline and an agreed metric you cannot prove value, prioritise scope, or say no. Features and vendors follow from it.'],
          ['Why demo on the customer\'s real (anonymised) data rather than a clean synthetic set?', ['It is faster to build', 'Real data exposes format, quality and edge-case issues early and builds trust', 'Synthetic data is illegal', 'The model performs better on real data'], 1, 'The riskiest assumption in most engagements is data quality/format. A demo on their mess de-risks it and is far more convincing.'],
          ['A "thin slice" means…', ['The cheapest possible model', 'An end-to-end path for one narrow use case, from input to measured output', 'Only the frontend', 'A slide deck'], 1, 'Thin slice = vertical, not horizontal: one narrow workflow working end to end so you can measure it.'],
          ['Which is an FDE-specific responsibility compared to a core product engineer?', ['Writing unit tests', 'Feeding repeated field patterns back to the product team', 'Using Git', 'Code review'], 1, 'FDEs are the field sensor: bespoke work that repeats across customers should become product.'],
          ['During discovery a stakeholder is visibly lukewarm. Best move?', ['Ignore them, the sponsor signed', 'Find out what they lose if it works and address it early', 'Escalate to their manager', 'Remove them from meetings'], 1, 'Hidden blockers (people whose job changes) kill pilots. Surface and address their incentives early.']
        ] },
        { type: 'refs', items: [['Palantir — what a Forward Deployed Engineer does (blog)', 'https://blog.palantir.com/a-day-in-the-life-of-a-palantir-forward-deployed-software-engineer-45ef2de257b1'], ['Amazon “Working Backwards” PR/FAQ method', 'https://www.aboutamazon.com/news/workplace/an-insider-look-at-amazons-culture-and-processes']] }
      ]),

      // ───────────────────────── 2
      mod(2, 'Production Python', 'Typing, async, packaging, FastAPI, testing — the Python you ship to customers.', [
        { type: 'visual', h: 'Request lifecycle in an async FastAPI service', tag: 'Visual', caption: 'One event loop, many in-flight requests. Anything blocking (sync DB driver, `time.sleep`, CPU work) stalls every request on that worker.', mermaid: `
flowchart LR
  C[Client] --> U["Uvicorn worker<br/>(event loop)"]
  U --> M["Middleware<br/>auth, request-id, timing"]
  M --> V["Pydantic validation<br/>request model"]
  V --> D["Depends()<br/>db session, user, settings"]
  D --> H["async handler"]
  H -->|await| IO1[("Postgres<br/>asyncpg")]
  H -->|await gather| IO2["LLM API"]
  H -->|await| IO3["Other service<br/>httpx.AsyncClient"]
  H --> R["Response model<br/>serialisation"]
  R --> C
  H -.CPU-heavy.-> P["run_in_threadpool /<br/>process pool / queue"]
` },
        { type: 'list', h: 'Core ideas', tag: 'Explain', items: [
          '**Typing:** annotate every public function; use `mypy --strict` or `pyright` in CI. `TypedDict` for dict shapes, `Protocol` for duck-typed interfaces, Pydantic models at I/O boundaries (validation + serialisation).',
          '**Async:** `async def` + `await` gives concurrency for I/O, not parallelism. Fan out with `asyncio.gather` (or `TaskGroup` in 3.11+), bound it with `asyncio.Semaphore`, and always set timeouts (`asyncio.timeout`, httpx timeouts).',
          '**Never block the loop:** a sync SDK call inside `async def` freezes the worker. Use the async client, `await run_in_threadpool(fn)`, or declare the route with plain `def` so FastAPI runs it in a thread pool.',
          '**Packaging:** `pyproject.toml` is the single source of truth; `uv` (or Poetry) for locking; src-layout; pin runtime deps in a lockfile, keep library deps as ranges.',
          '**FastAPI:** request/response models, `Depends` for DI (db session, current user, settings), `lifespan` for startup/shutdown (create one shared `httpx.AsyncClient`), `BackgroundTasks` only for small fire-and-forget work — use a real queue for anything that must not be lost.',
          '**Testing:** `pytest` + fixtures + `parametrize`; `httpx.AsyncClient(transport=ASGITransport(app))` for API tests; override dependencies with `app.dependency_overrides`; mock external APIs at the HTTP boundary (`respx`), not deep inside your code.'
        ] },
        { type: 'csnote', items: [
          'Type hints are **not enforced at runtime** (unlike C#). The checker (mypy/pyright) is your compiler — run it in CI.',
          '`async/await` looks like C# `Task`, but Python runs one event loop per thread with no implicit thread-pool continuation; CPU work blocks everything.',
          '`Depends()` is FastAPI\'s DI; closer to ASP.NET minimal-API parameter injection than a container you configure.',
          'No `IDisposable`/`using`: use context managers (`with` / `async with`).'
        ] },
        { type: 'code', h: 'Worked example — bounded concurrent fan-out with timeouts', tag: 'Example', code: `
import asyncio
from contextlib import asynccontextmanager

import httpx
from fastapi import Depends, FastAPI, Request
from pydantic import BaseModel


class SummariseIn(BaseModel):
    doc_ids: list[str]


class SummaryOut(BaseModel):
    doc_id: str
    summary: str | None
    error: str | None = None


@asynccontextmanager
async def lifespan(app: FastAPI):
    # one pooled client for the whole process, closed on shutdown
    app.state.http = httpx.AsyncClient(timeout=httpx.Timeout(10.0, connect=2.0))
    yield
    await app.state.http.aclose()


app = FastAPI(lifespan=lifespan)
SEM = asyncio.Semaphore(8)  # protect the downstream API from our own fan-out


def get_http(request: Request) -> httpx.AsyncClient:
    return request.app.state.http


async def summarise_one(http: httpx.AsyncClient, doc_id: str) -> SummaryOut:
    async with SEM:
        try:
            r = await http.post("https://llm.internal/summarise", json={"id": doc_id})
            r.raise_for_status()
            return SummaryOut(doc_id=doc_id, summary=r.json()["text"])
        except (httpx.HTTPError, KeyError) as e:
            return SummaryOut(doc_id=doc_id, summary=None, error=type(e).__name__)


@app.post("/summaries", response_model=list[SummaryOut])
async def summaries(body: SummariseIn, http: httpx.AsyncClient = Depends(get_http)):
    # partial failure is returned per item instead of failing the whole batch
    return await asyncio.gather(*(summarise_one(http, d) for d in body.doc_ids))
`, note: 'Design choices to say out loud in an interview: shared client (connection pooling), semaphore (backpressure), per-item errors (partial failure), explicit timeouts.' },
        { type: 'callout', h: 'Real FDE scenario', tag: 'Scenario', body: 'A customer\'s pilot API times out under load. Traces show p95 latency jumps from 2 s to 40 s when 20 users hit it. Root cause: the vendor\'s PDF SDK is synchronous and was called inside `async def`, blocking the event loop; every request queued behind it. Fix: move the call to `run_in_threadpool` (short term) and to a background worker queue (proper fix), add a load test to CI.' },
        { type: 'list', h: 'Hands-on task (45 min)', tag: 'Task', ordered: true, items: [
          'Create a project with `uv init`, add FastAPI, httpx, pytest, pytest-asyncio, respx.',
          'Implement the `/summaries` endpoint above.',
          'Write 3 tests: all succeed; one downstream 500 returns a per-item error; semaphore limits concurrency to 8 (hint: count in-flight calls in the mock).',
          'Run `mypy --strict` and fix every error.'
        ] },
        { type: 'list', h: 'Practice questions', tag: 'Practice', ordered: true, items: [
          'Explain why `time.sleep(1)` inside an `async def` route hurts every user, and give two fixes.',
          'When would you choose `def` over `async def` for a FastAPI route?',
          'How do you test a route that depends on a database session without touching the real database?'
        ] },
        { type: 'quiz', qs: [
          ['You call a synchronous SDK inside an `async def` FastAPI route. What happens under load?', ['FastAPI automatically threads it', 'The event loop blocks, so all concurrent requests on that worker stall', 'Python raises an error', 'Nothing — the GIL handles it'], 1, 'Only plain `def` routes are run in the thread pool. Sync I/O inside `async def` blocks the loop.'],

import asyncio, hashlib, hmac, random, time
import httpx

RETRYABLE = {429, 502, 503, 504}


async def request_with_retry(client: httpx.AsyncClient, method: str, url: str,
                             *, max_attempts: int = 5, base: float = 0.5, cap: float = 20.0, **kw):
    for attempt in range(1, max_attempts + 1):
        try:
            resp = await client.request(method, url, **kw)
            if resp.status_code not in RETRYABLE:
                return resp                         # success OR non-retryable error: caller decides
            retry_after = resp.headers.get("Retry-After")
        except (httpx.ConnectError, httpx.ReadTimeout):
            retry_after = None
        if attempt == max_attempts:
            raise RuntimeError(f"gave up after {attempt} attempts: {method} {url}")
        delay = float(retry_after) if retry_after and retry_after.isdigit() \\
            else random.uniform(0, min(cap, base * 2 ** attempt))   # full jitter
        await asyncio.sleep(delay)


def verify_webhook(raw_body: bytes, header_sig: str, header_ts: str, secret: bytes,
                   tolerance_s: int = 300) -> bool:
    if abs(time.time() - int(header_ts)) > tolerance_s:
        return False                                # replay protection
    expected = hmac.new(secret, f"{header_ts}.".encode() + raw_body, hashlib.sha256).hexdigest()
    return hmac.compare_digest(expected, header_sig)  # constant-time compare
`, note: 'POST retries are only safe if the endpoint is idempotent (or you send an Idempotency-Key). Verify the signature on the raw bytes — not re-serialised JSON.' },

-- keep the most recently updated row per normalised email, quarantine the rest
WITH normalised AS (
  SELECT *,
         lower(trim(email))                               AS email_norm,
         ROW_NUMBER() OVER (
           PARTITION BY lower(trim(email))
           ORDER BY updated_at DESC NULLS LAST, id
         )                                                AS rn
  FROM staging.customers
  WHERE email IS NOT NULL AND email LIKE '%@%'
)
INSERT INTO core.customers (email, name, phone, updated_at)
SELECT email_norm, initcap(trim(name)), regexp_replace(phone, '[^0-9+]', '', 'g'), updated_at
FROM normalised
WHERE rn = 1
ON CONFLICT (email) DO UPDATE
  SET name = EXCLUDED.name, phone = EXCLUDED.phone, updated_at = EXCLUDED.updated_at
  WHERE core.customers.updated_at < EXCLUDED.updated_at;   -- idempotent, never goes backwards

import json, statistics
from dataclasses import dataclass


@dataclass
class Case:
    id: str
    question: str
    expected_facts: list[str]     # facts the answer must contain
    must_pass: bool = False


JUDGE_PROMPT = """You are grading an answer against required facts.
Answer: {answer}
Required facts: {facts}
For each fact say SUPPORTED or MISSING, then output JSON {{"score": <fraction supported>}}."""


def run_eval(cases: list[Case], system, judge, baseline: float, tolerance: float = 0.02):
    scores, failures = [], []
    for c in cases:
        answer = system(c.question)                      # traced in Langfuse by the system itself
        result = json.loads(judge(JUDGE_PROMPT.format(answer=answer, facts=c.expected_facts)))
        scores.append(result["score"])
        if c.must_pass and result["score"] < 1.0:
            failures.append(c.id)
    mean = statistics.mean(scores)
    ok = not failures and mean >= baseline - tolerance
    print(f"mean={mean:.3f} baseline={baseline:.3f} must_pass_failures={failures}")

import time


class CircuitBreaker:
    def __init__(self, fail_threshold: int = 5, reset_after_s: float = 30):
        self.fails, self.opened_at = 0, None
        self.fail_threshold, self.reset_after_s = fail_threshold, reset_after_s

    def allow(self) -> bool:
        if self.opened_at is None:
            return True
        if time.monotonic() - self.opened_at > self.reset_after_s:
            return True                      # half-open: let one request probe
        return False

    def record(self, ok: bool) -> None:
        if ok:
            self.fails, self.opened_at = 0, None
        else:
            self.fails += 1
            if self.fails >= self.fail_threshold:
                self.opened_at = time.monotonic()


async def generate_with_fallback(prompt: str, providers: list, breakers: dict) -> str:
    for p in providers:                      # e.g. [primary_model, secondary_model]
        if not breakers[p.name].allow():
            continue
        try:
            out = await p.generate(prompt, timeout=20)
            breakers[p.name].record(True)
            return out
        except Exception:
            breakers[p.name].record(False)
    return "I can't answer that right now — I've passed this to a colleague."  # safe fallback
` },

  ['done', 'quiz', 'struggled', 'solved'].forEach(k => { S[k] = S[k] || {}; });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked */ } };

  const items = T.items;
  const modules = items.filter(i => i.kind !== 'checkpoint');
  const byId = Object.fromEntries(items.map(i => [i.id, i]));

  // ---------- tiny markdown ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function md(s) {
    if (s == null) return '';
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  const paras = s => String(s).split(/\n\s*\n/).map(p => '<p>' + md(p.trim()).replace(/\n/g, '<br>') + '</p>').join('');
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  const head = b => b.h ? `<h3>${b.tag ? `<span class="tag">${esc(b.tag)}</span>` : ''}${md(b.h)}</h3>` : '';

  // ---------- theme ----------
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(theme);
  const isDark = () => {
    const t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  };
  const themeIcon = () => { $('#themeBtn').textContent = isDark() ? '☀' : '☾'; };
  $('#themeBtn').onclick = () => {
    theme = isDark() ? 'light' : 'dark';
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    themeIcon();
    route(true);
  };
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (!theme) { themeIcon(); route(true); } };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
  }
  themeIcon();
  $('#menuBtn').onclick = () => document.body.classList.toggle('nav-open');

  // ---------- mermaid ----------
  let mermaidReady = false;
  function initMermaid() {
    if (!window.mermaid) return false;
    window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'default', flowchart: { useMaxWidth: true, htmlLabels: true } });
    mermaidReady = true;
    return true;
  }
  async function renderDiagrams(root) {
    const nodes = [...root.querySelectorAll('.diagram[data-src]')];
    if (!nodes.length) return;
    if (!initMermaid()) {
      nodes.forEach(n => { n.innerHTML = '<pre class="code mermaid-src"></pre><p class="small muted">Diagram library offline — Mermaid source shown. Paste it into mermaid.live to view.</p>'; n.firstChild.textContent = n.dataset.src; });
      return;
    }
    for (const [i, n] of nodes.entries()) {
      try {
        const { svg } = await window.mermaid.render('mmd-' + Date.now() + '-' + i, n.dataset.src);
        n.innerHTML = svg;
        const vb = n.querySelector('svg') && n.querySelector('svg').viewBox.baseVal;
        if (vb && vb.width > 700) n.classList.add('wide');
      } catch (err) {
        n.innerHTML = '<pre class="code mermaid-src"></pre>';
        n.firstChild.textContent = n.dataset.src;
      }
    }
  }

  // ---------- block renderers ----------
  const R = {
    visual(b) {
      const f = el('section', 'block');
      f.innerHTML = head(b) + '<figure class="visual"><div class="diagram"></div><figcaption></figcaption></figure>';
      $('.diagram', f).dataset.src = b.mermaid;
      $('figcaption', f).innerHTML = md(b.caption || '') + ' <span>Source: ' + (b.source ? md(b.source) : 'diagram drawn for this guide') + '.</span>';
      return f;
    },
    text(b) { return el('section', 'block', head(b) + paras(b.body)); },
    callout(b) { return el('section', 'block callout', head(b) + paras(b.body)); },
    csnote(b) { return el('section', 'block csnote', '<h3><span class="tag">C# → Python</span></h3><ul>' + b.items.map(i => '<li>' + md(i) + '</li>').join('') + '</ul>'); },
    list(b) {
      const t = b.ordered ? 'ol' : 'ul';
      return el('section', 'block', head(b) + `<${t}>` + b.items.map(i => '<li>' + md(i) + '</li>').join('') + `</${t}>`);
    },
    code(b) {
      const s = el('section', 'block', head(b) + '<pre class="code"><code></code></pre>' + (b.note ? '<p class="small muted" style="margin-top:10px">' + md(b.note) + '</p>' : ''));
      $('code', s).textContent = b.code.replace(/^\n/, '');
      return s;
    },
    table(b) {
      return el('section', 'block', head(b) + '<div class="table-wrap"><table><thead><tr>' + b.cols.map(c => '<th>' + md(c) + '</th>').join('') +
        '</tr></thead><tbody>' + b.rows.map(r => '<tr>' + r.map(c => '<td>' + md(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
    },
    refs(b) {
      return el('section', 'block', '<h3><span class="tag">Read</span>Diagrams &amp; references</h3><ul>' +
        b.items.map(([l, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${md(l)}</a></li>`).join('') + '</ul>');
    },
    problems(b, item) {
      const s = el('section', 'block', head(Object.assign({ h: 'Question set', tag: 'Practice' }, b)) +
        '<p class="small muted">Tick a problem when you have solved it on your own (no HINT / SOLUTION). 🔒 = LeetCode Premium; the same problem is free on NeetCode or LintCode.</p>' +
        '<div class="table-wrap"><table><thead><tr><th></th><th>#</th><th>Problem</th><th>Difficulty</th><th>Asked at</th><th>List</th></tr></thead><tbody></tbody></table></div>');
      const tb = $('tbody', s);
      b.rows.forEach((r, i) => {
        const [title, slug, diff, asked, list, premium] = r;
        const tr = el('tr', S.solved[slug] ? 'solved' : '');
        tr.innerHTML = `<td class="chk"><input type="checkbox" aria-label="solved"${S.solved[slug] ? ' checked' : ''}></td><td>${i + 1}</td>` +
          `<td><a href="https://leetcode.com/problems/${esc(slug)}/" target="_blank" rel="noopener">${esc(title)}</a>${premium ? ' 🔒' : ''}</td>` +
          `<td><span class="diff ${esc(diff)}">${esc(diff)}</span></td><td>${md(asked || 'commonly reported')}</td><td class="small">${md(list || '')}</td>`;
        $('input', tr).onchange = e => {
          if (e.target.checked) S.solved[slug] = true; else delete S.solved[slug];
          tr.className = e.target.checked ? 'solved' : '';
          save(); renderNav(item.id);
        };
        tb.appendChild(tr);
      });
      return s;
    },
    quiz(b, item) {
      const qs = b.qs;
      const s = el('section', 'block quiz', `<h3><span class="tag">Quiz</span>${md(b.h || 'Check yourself')} <span class="muted small">· ${qs.length} questions</span></h3>`);
      const state = new Array(qs.length).fill(null);
      const answers = [];
      const score = el('span', 'score');
      qs.forEach((q, qi) => {
        const [text, rawOpts, rawAns, why] = q;
        // shuffle options so the correct answer's position carries no signal
        const order = rawOpts.map((_, i) => i);
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
        const opts = order.map(i => rawOpts[i]);
        const ans = order.indexOf(rawAns);
        answers[qi] = ans;
        const card = el('div', 'q', `<p class="q-text"><b>Q${qi + 1}.</b> ${md(text)}</p><div class="opts"></div><p class="why" hidden></p>`);
        const box = $('.opts', card);
        opts.forEach((o, oi) => {
          const btn = el('button', 'opt', `<span class="letter">${'ABCDEF'[oi]}</span><span>${md(o)}</span>`);
          btn.onclick = () => {
            if (state[qi] !== null) return;
            state[qi] = oi;
            [...box.children].forEach((c, ci) => {
              c.disabled = true;
              if (ci === ans) c.classList.add('correct'); else if (ci === oi) c.classList.add('wrong');
            });
            const w = $('.why', card);
            w.hidden = false;
            w.innerHTML = (oi === ans ? '<b class="ok">Correct.</b> ' : '<b class="no">Not quite.</b> ') + md(why);
            update();
          };
          box.appendChild(btn);
        });
        s.appendChild(card);
      });
      const foot = el('div', 'quiz-foot');
      const prev = S.quiz[item.id];
      const best = el('span', 'muted small', prev ? `Best so far: ${prev.best}/${prev.total}` : '');
      const retry = el('button', 'btn', 'Retry quiz');
      retry.onclick = () => route(true);
      foot.append(score, best, retry);
      s.appendChild(foot);
      function update() {
        const answered = state.filter(x => x !== null).length;
        const right = state.filter((x, i) => x === answers[i]).length;
        score.textContent = `Score: ${right}/${answered}` + (answered < qs.length ? ` (${qs.length - answered} left)` : '');
        if (answered === qs.length) {
          const p = S.quiz[item.id];
          S.quiz[item.id] = { last: right, best: Math.max(right, p ? p.best : 0), total: qs.length };
          best.textContent = `Best so far: ${S.quiz[item.id].best}/${qs.length}`;
          save(); renderNav(item.id);
        }
      }
      update();
      return s;
    }
  };

  // ---------- progress ----------
  function pct() { return Math.round(100 * modules.filter(m => S.done[m.id]).length / modules.length); }
  const label = i => (i.kind === 'checkpoint' ? '' : i.num + '. ') + i.title;
  function progressBlock() {
    const done = modules.filter(m => S.done[m.id]);
    const last = done[done.length - 1];
    const next = modules.find(m => !S.done[m.id]);
    const struggled = [];
    items.forEach(i => {
      const q = S.quiz[i.id];
      if (S.struggled[i.id] && S.struggled[i.id].trim()) struggled.push(`${i.short || i.title}: ${S.struggled[i.id].trim().replace(/\s*\n\s*/g, '; ')}`);
      if (q && q.last / q.total < 0.7) struggled.push(`${i.short || i.title} quiz ${q.last}/${q.total}`);
    });
    const solved = Object.keys(S.solved).length;
    return [
      'PROGRESS',
      `Track | ${T.key} — ${T.name}`,
      `Module done | ${last ? label(last) : 'none yet'}${done.length ? ` (${done.length}/${modules.length} complete)` : ''}${T.showSolved ? ` · ${solved} problems solved` : ''}`,
      `Topics I struggled with | ${struggled.length ? struggled.join(' · ') : 'none recorded'}`,
      `Next module | ${next ? label(next) : 'track complete'}`
    ].join('\n');
  }
  function copy(text, btn) {
    const done = () => { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = o; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
    else fallback();
    function fallback() {
      const ta = el('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.remove();
    }
  }

  // ---------- nav ----------
  function status(i) {
    if (i.kind === 'checkpoint') return S.quiz[i.id] ? '✅' : '🧩';
    return S.done[i.id] ? '✅' : '⬜';
  }
  function renderNav(active) {
    const side = $('#side');
    let html = `<a class="nav${active === 'home' ? ' active' : ''}" href="#home"><span class="st">🗺</span>Roadmap</a>` +
      `<a class="nav${active === 'progress' ? ' active' : ''}" href="#progress"><span class="st">📋</span>Progress &amp; commands</a>`;
    let group = null;
    items.forEach(i => {
      if (i.group !== group) { group = i.group; if (group) html += `<h4>${md(group)}</h4>`; }
      const q = S.quiz[i.id];
      html += `<a class="nav${i.kind === 'checkpoint' ? ' checkpoint' : ''}${active === i.id ? ' active' : ''}" href="#${i.id}"><span class="st">${status(i)}</span><span>${md(label(i))}</span>` +
        (q ? `<span class="sc">${q.best}/${q.total}</span>` : '') + '</a>';
    });
    html += '<h4>Other tracks</h4><div class="tracks">' + T.otherTracks.map(([l, f]) => `<a href="${esc(f)}">${md(l)}</a>`).join('') + '<a href="index.html">All tracks</a></div>';
    side.innerHTML = html;
    $('#barFill').style.width = pct() + '%';
    $('#barText').textContent = modules.filter(m => S.done[m.id]).length + '/' + modules.length;
  }

  // ---------- views ----------
  function viewHome(main) {
    main.appendChild(el('div', 'hero', `<div class="kicker">Track ${esc(T.key)}</div><h1>${md(T.name)}</h1>${paras(T.intro)}`));
    const rm = el('section', 'block', '<h3><span class="tag">Roadmap</span>Fixed path — one module per session</h3><ul class="roadmap"></ul>');
    const ul = $('ul', rm);
    items.forEach(i => {
      const q = S.quiz[i.id];
      const li = el('li', '', `<span>${status(i)}</span><a href="#${i.id}">${md(label(i))}</a><span class="sc">${q ? 'quiz ' + q.best + '/' + q.total : ''}</span>`);
      ul.appendChild(li);
    });
    main.appendChild(rm);
    (T.homeBlocks || []).forEach(b => main.appendChild(R[b.type](b, { id: 'home' })));
  }
  function viewProgress(main) {
    main.appendChild(el('div', 'hero', `<div class="kicker">Track ${esc(T.key)}</div><h1>Progress &amp; commands</h1><p class="muted">Paste this block at the start of your next tutor session to resume exactly where you left off.</p>`));
    const pb = el('section', 'block', '<h3><span class="tag">Resume</span>PROGRESS block</h3><pre class="code progress-block"></pre><div class="row" style="margin-top:12px"></div>');
    $('pre', pb).textContent = progressBlock();
    const c = el('button', 'btn primary', 'Copy PROGRESS block');
    c.onclick = () => copy(progressBlock(), c);
    const next = modules.find(m => !S.done[m.id]);
    const st = el('button', 'btn', next ? `Copy “START: ${T.cmd} ${next.num}”` : 'Track complete');
    if (next) st.onclick = () => copy(`START: ${T.cmd} ${next.num}`, st);
    $('.row', pb).append(c, st);
    main.appendChild(pb);
    main.appendChild(el('section', 'block', '<h3><span class="tag">Tutor</span>Commands</h3><div class="cmds">' + [
      ['START: ' + T.cmd + ' <n>', 'Begin module n of this track directly'],
      ['NEXT', 'Move to the next module or question'],
      ['HINT', 'Next hint only — never the full answer'],
      ['SOLUTION', 'Full optimal solution with explanation'],
      ['SIMPLER', 'Re-explain with a simpler analogy'],
      ['DEEPER', 'One level deeper: internals, edge cases, trade-offs'],
      ['REVISE', 'Quick recap of everything done in this track'],
      ['ROADMAP', 'Full path with ✅ for completed modules']
    ].map(([k, v]) => `<code>${esc(k)}</code><span>${esc(v)}</span>`).join('') + '</div>'));
    const reset = el('section', 'block', '<h3>Reset</h3><p class="muted small">Progress lives only in this browser. Resetting clears ticks, quiz scores and notes for this track.</p>');
    const rb = el('button', 'btn', 'Reset this track');
    rb.onclick = () => { if (confirm('Clear all progress for this track?')) { S = { done: {}, quiz: {}, struggled: {}, solved: {} }; save(); route(); } };
    reset.appendChild(rb);
    main.appendChild(reset);
  }
  function viewItem(main, item) {
    const idx = items.indexOf(item);
    main.appendChild(el('div', 'hero', `<div class="kicker">${item.group ? md(item.group) + ' · ' : ''}${item.kind === 'checkpoint' ? 'Checkpoint' : 'Module ' + item.num + ' of ' + modules.length}</div><h1>${md(item.title)}</h1>${item.summary ? '<p class="muted">' + md(item.summary) + '</p>' : ''}`));
    item.blocks.forEach(b => {
      if (!R[b.type]) return;
      main.appendChild(R[b.type](b, item));
    });
    if (item.kind !== 'checkpoint') {
      const end = el('section', 'block', '<h3><span class="tag">Wrap-up</span>End of session</h3><p class="small muted">Note anything that felt shaky — it goes into your PROGRESS block.</p><textarea placeholder="Topics I struggled with…"></textarea><div class="row" style="margin-top:12px"></div>');
      const ta = $('textarea', end);
      ta.value = S.struggled[item.id] || '';
      ta.oninput = () => { S.struggled[item.id] = ta.value; save(); };
      const db = el('button', 'btn' + (S.done[item.id] ? ' done' : ' primary'), S.done[item.id] ? '✅ Module done' : 'Mark module done');
      db.onclick = () => {
        if (S.done[item.id]) delete S.done[item.id]; else S.done[item.id] = Date.now();
        save(); route(true);
      };
      const pb = el('button', 'btn', 'Copy PROGRESS block');
      pb.onclick = () => copy(progressBlock(), pb);
      const sb = el('button', 'btn', `Copy “START: ${T.cmd} ${item.num}”`);
      sb.onclick = () => copy(`START: ${T.cmd} ${item.num}`, sb);
      $('.row', end).append(db, pb, sb);
      main.appendChild(end);
    }
    const pager = el('div', 'pager');
    const prev = items[idx - 1], next = items[idx + 1];
    pager.innerHTML = (prev ? `<a class="btn" href="#${prev.id}">← ${md(label(prev))}</a>` : '<span></span>') +
      (next ? `<a class="btn primary" href="#${next.id}">${md(label(next))} →</a>` : '');
    main.appendChild(pager);
  }

  function route(keepScroll) {
    const id = decodeURIComponent(location.hash.slice(1)) || 'home';
    const main = $('#main');
    const y = window.scrollY;
    main.innerHTML = '';
    if (id === 'progress') viewProgress(main);
    else if (byId[id]) viewItem(main, byId[id]);
    else viewHome(main);
    renderNav(byId[id] || id === 'progress' ? id : 'home');
    document.title = (byId[id] ? label(byId[id]) + ' · ' : '') + T.title;
    document.body.classList.remove('nav-open');
    if (keepScroll === true) window.scrollTo(0, y); else window.scrollTo(0, 0);
    renderDiagrams(main);
  }

  $('#trackName').textContent = T.name;
  window.addEventListener('hashchange', () => route());
  route();
})();

</script>
</body>
</html>
