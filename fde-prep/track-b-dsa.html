<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Patterns Track</title>
<style>
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-2: #f0f0ec;
  --text: #1c1c1e;
  --muted: #62646a;
  --border: #e0e0da;
  --accent: #2c55d6;
  --accent-soft: #e7edfc;
  --good: #17784a;
  --good-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe8e6;
  --warn-soft: #fdf3dc;
  --code-bg: #f2f2ee;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --surface: #1b1c1f; --surface-2: #232428; --text: #ececee; --muted: #a0a2a8;
    --border: #303137; --accent: #8aa8ff; --accent-soft: #1f2a4a; --good: #6fd39b; --good-soft: #16301f;
    --bad: #ff8a80; --bad-soft: #3a1d1b; --warn-soft: #3a3016; --code-bg: #232428;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --surface: #1b1c1f; --surface-2: #232428; --text: #ececee; --muted: #a0a2a8;
  --border: #303137; --accent: #8aa8ff; --accent-soft: #1f2a4a; --good: #6fd39b; --good-soft: #16301f;
  --bad: #ff8a80; --bad-soft: #3a1d1b; --warn-soft: #3a3016; --code-bg: #232428;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre code { overflow-wrap: normal; }
pre.code { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; line-height: 1.5; margin: 0; }
pre.code code { background: none; padding: 0; }
h1, h2, h3 { line-height: 1.25; letter-spacing: -0.01em; }
h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 0 0 10px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text); text-decoration: none; min-width: 0; }
.brand span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { background: var(--accent); color: var(--surface); border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
.top-progress { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.bar { width: 140px; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
.menu-btn { display: none; }

/* layout */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 55px); }
.side { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 10px 40px; position: sticky; top: 55px; height: calc(100vh - 55px); overflow-y: auto; }
.side h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 8px 6px; }
.side a.nav { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 7px; color: var(--text); text-decoration: none; font-size: 14px; }
.side a.nav:hover { background: var(--surface-2); }
.side a.nav.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side a.nav .st { width: 18px; flex: none; text-align: center; }
.side a.nav .sc { margin-left: auto; font-size: 11px; color: var(--muted); flex: none; }
.side a.nav.checkpoint { font-style: italic; }
.side .tracks a { display: block; padding: 4px 8px; font-size: 13px; }
main { padding: 28px 32px 80px; max-width: 980px; width: 100%; outline: none; }

/* blocks */
.block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin: 0 0 16px; box-shadow: var(--shadow); }
.block > h3 .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; margin-right: 8px; vertical-align: 2px; }
.block p { margin: 0 0 10px; }
.block p:last-child { margin-bottom: 0; }
.block ul, .block ol { margin: 0; padding-left: 22px; }
.block li { margin: 4px 0; }
.block.callout { background: var(--warn-soft); }
.block.csnote { border-left: 4px solid var(--accent); }
.block.concept h3 { margin-bottom: 12px; }
.c-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-top: 1px solid var(--border); }
.c-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 3px; }
.c-body > * + * { margin-top: 10px; }
.c-body p { margin: 0 0 8px; }
.walk { padding-left: 22px; margin: 0; }
.walk > li { margin: 0 0 12px; }
.walk > li > div { margin-top: 4px; }
@media (max-width: 600px) { .c-row { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.hero { margin-bottom: 18px; }
.hero .kicker { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

figure.visual { margin: 0; }
figure.visual .diagram { overflow-x: auto; text-align: center; padding: 6px 0; }
figure.visual .diagram svg { max-width: 100%; height: auto; }
figure.visual pre.mermaid-src { text-align: left; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
.table-wrap { overflow-x: auto; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
td.chk { width: 32px; }
tr.solved td { color: var(--muted); }
tr.solved td a { color: var(--muted); text-decoration: line-through; }
.diff { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.diff.Easy { background: var(--good-soft); color: var(--good); }
.diff.Medium { background: var(--warn-soft); color: #9a6700; }
.diff.Hard { background: var(--bad-soft); color: var(--bad); }
:root[data-theme="dark"] .diff.Medium { color: #e3b341; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .diff.Medium { color: #e3b341; } }

/* quiz */
.q { padding: 14px 0; border-top: 1px solid var(--border); }
.q:first-of-type { border-top: 0; padding-top: 4px; }
.q-text { margin: 0 0 10px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 9px 12px; font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .letter { font-weight: 700; color: var(--muted); flex: none; }
.opt.correct { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.why { margin: 10px 0 0; font-size: 14px; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; }
.ok { color: var(--good); } .no { color: var(--bad); }
.quiz-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.score { font-weight: 600; }

/* controls */
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: inherit; background: var(--surface); color: var(--text); resize: vertical; }
.progress-block { white-space: pre-wrap; }

.roadmap { list-style: none; padding: 0 !important; margin: 0; }
.roadmap li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); margin: 0 !important; }
.roadmap li:last-child { border-bottom: 0; }
.roadmap .sc { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.cmds { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.cmds code { font-weight: 600; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  .side { display: none; position: fixed; top: 55px; left: 0; right: 0; bottom: 0; height: auto; z-index: 15; border-right: 0; }
  body.nav-open .side { display: block; }
  main { padding: 20px 16px 60px; }
  .bar { width: 70px; }
  .block { padding: 16px; }
  figure.visual .diagram.wide svg { min-width: 620px; }
}

</style>
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
  <a class="brand" href="#home"><span class="badge">B</span><span id="trackName"></span></a>
  <div class="top-progress" title="Modules completed">
    <div class="bar"><span id="barFill"></span></div><span id="barText"></span>
  </div>
  <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light / dark"></button>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<script>
/* Track B — DSA patterns. Problem row: [title, slug, difficulty, askedAt, list, premium]. */
(function () {
  const NC = 'NeetCode 150';
  const LC = 'LeetCode classic';
  const E = 'Easy', M = 'Medium', H = 'Hard';
  const CR = 'commonly reported';
  // p(title, slug, diff, inNeetCode150, premium)
  const p = (t, s, d, nc, prem) => [t, s, d, CR, nc ? NC : LC, !!prem];

  let n = 0;
  const pat = (title, summary, blocks) => { n += 1; return { id: 'b' + n, num: n, title, short: 'B' + n, summary, kind: 'module', group: 'Patterns', blocks }; };
  let c = 0;
  const checkpoint = (after, qs, note) => { c += 1; return { id: 'cp' + c, kind: 'checkpoint', title: `Checkpoint ${c}: mixed problems (after pattern ${after})`, short: 'Checkpoint ' + c, group: 'Patterns', summary: note || 'Name the pattern BEFORE solving. Then solve each problem on LeetCode and bring your code to the tutor.', blocks: [{ type: 'quiz', h: 'Name the pattern', qs }] }; };

  const cues = items => ({ type: 'list', h: 'Recognition cues', tag: 'b · Cues', items });
  const tmpl = (code, note) => ({ type: 'code', h: 'Python template', tag: 'c · Template', code, note });
  const vars = items => ({ type: 'list', h: 'Common variations and mistakes', tag: 'd · Mistakes', items });
  const probs = rows => ({ type: 'problems', h: `Question set (${rows.length})`, tag: 'e · Practice', rows });
  const steps = (h, cols, rows) => ({ type: 'table', h, tag: 'a · Walkthrough', cols, rows });
  const vis = (h, mermaid, caption) => ({ type: 'visual', h, tag: 'a · Visual', mermaid, caption });
  const cs = items => ({ type: 'csnote', items });
  const quiz = qs => ({ type: 'quiz', h: 'Pattern quiz', qs });

  const P = ['Arrays & Hashing', 'Two Pointers', 'Sliding Window', 'Prefix Sum', 'Binary Search', 'Stack / Monotonic Stack', 'Linked List', 'Matrix / Grid', 'Trees', 'Heap / Top-K', 'Intervals & Line Sweep', 'Backtracking', 'Graphs', 'Advanced Graphs', '1-D DP', '2-D DP', 'Greedy', 'Design DS', 'Tries', 'Bit Manipulation'];

  const items = [
    // ───────────── 1
    pat('Arrays & Hashing', 'Trade memory for time: a dict/set turns "search the rest of the array" into O(1).', [
      vis('Which hash structure?', `
flowchart TD
  Q["Need fast lookup?"] --> A{"What do you look up?"}
  A -->|"seen before? (yes/no)"| S["set()"]
  A -->|"value → index / info"| D["dict"]
  A -->|"how many times?"| C["Counter"]
  A -->|"group items by a key"| G["defaultdict(list)<br/>key = tuple / sorted string"]
`, 'Pick the structure by the question you ask of it.'),
      steps('Two Sum on nums = [2, 7, 11, 15], target = 9', ['Step', 'i, x', 'need = target − x', 'seen (value → index)', 'Action'], [
        ['1', '0, 2', '7', '{}', '7 not in seen → store 2:0'],
        ['2', '1, 7', '2', '{2: 0}', '2 in seen → return [0, 1]']
      ]),
      cues(['"Find two items that sum / match…"', '"Contains duplicate", "first unique", "appears more than n/2 times"', '"Anagram", "same characters", "group by"', '"Count frequency", "top k frequent"', '"Do it in O(n)" when brute force is O(n²)']),
      tmpl(`
from collections import Counter, defaultdict

def two_sum(nums: list[int], target: int) -> list[int]:
    seen: dict[int, int] = {}          # value -> index
    for i, x in enumerate(nums):
        if target - x in seen:         # check BEFORE inserting (don't pair x with itself)
            return [seen[target - x], i]
        seen[x] = i
    return []

def group_anagrams(words: list[str]) -> list[list[str]]:
    groups: defaultdict[tuple, list[str]] = defaultdict(list)
    for w in words:
        count = [0] * 26
        for ch in w:
            count[ord(ch) - ord('a')] += 1
        groups[tuple(count)].append(w)   # lists aren't hashable -> tuple key
    return list(groups.values())

def is_anagram(a: str, b: str) -> bool:
    return Counter(a) == Counter(b)
`),
      cs(['`dict` = `Dictionary<K,V>`, `set` = `HashSet<T>`; `Counter` / `defaultdict` have no direct C# equivalent (use `GetValueOrDefault`).', 'Keys must be hashable: `tuple` works, `list` does not (C# would compile a `List<int>` key but compare by reference).', '`x in d` is `ContainsKey`; iterating a dict yields keys in insertion order.']),
      vars(['Inserting before checking in Two Sum → pairs an element with itself.', 'Using a `list` as a dict key → `TypeError: unhashable type`.', 'Sorting (O(n log n)) when a hash map gives O(n); fine if the interviewer accepts it — say the trade-off.', 'Longest Consecutive: only start counting from numbers where `x - 1` is not in the set, otherwise O(n²).', 'Product Except Self: prefix products left→right then suffix right→left, no division (zeros!).']),
      probs([
        p('Contains Duplicate', 'contains-duplicate', E, 1), p('Valid Anagram', 'valid-anagram', E, 1), p('Two Sum', 'two-sum', E, 1),
        p('Majority Element', 'majority-element', E, 0), p('Isomorphic Strings', 'isomorphic-strings', E, 0),
        p('Group Anagrams', 'group-anagrams', M, 1), p('Top K Frequent Elements', 'top-k-frequent-elements', M, 1),
        p('Product of Array Except Self', 'product-of-array-except-self', M, 1), p('Valid Sudoku', 'valid-sudoku', M, 1),
        p('Encode and Decode Strings', 'encode-and-decode-strings', M, 1, 1), p('Longest Consecutive Sequence', 'longest-consecutive-sequence', M, 1),
        p('First Missing Positive', 'first-missing-positive', H, 0)
      ]),
      quiz([
        ['Time complexity of the hash-map Two Sum?', ['O(n²)', 'O(n log n)', 'O(n) average', 'O(1)'], 2, 'One pass; each dict lookup/insert is O(1) average.'],
        ['Best key for grouping anagrams in O(n·k)?', ['`sorted(w)` as a list', 'A tuple of 26 letter counts', 'The word length', '`hash(w)`'], 1, 'Counts tuple is O(k) and hashable; `sorted` is O(k log k) and must be converted to a tuple/string.'],
        ['Longest Consecutive Sequence in O(n): when do you start counting a run?', ['At every number', 'Only when `x - 1` is not in the set', 'Only when `x + 1` is in the set', 'After sorting'], 1, 'Starting only at run beginnings makes each number visited O(1) times overall.'],
        ['Why does `{[1,2]: "a"}` fail in Python?', ['Dict keys must be strings', 'Lists are mutable and unhashable', 'Keys must be sorted', 'It works'], 1, 'Use a tuple `(1, 2)` instead.']
      ])
    ]),

    // ───────────── 2
    pat('Two Pointers', 'Two indices moving toward each other or in the same direction replace a nested loop.', [
      steps('Two Sum II on sorted [1, 2, 3, 4, 6, 8], target = 10', ['Step', 'L (value)', 'R (value)', 'sum', 'Action'], [
        ['1', '0 (1)', '5 (8)', '9', '9 < 10 → need bigger → L += 1'],
        ['2', '1 (2)', '5 (8)', '10', 'found → return [2, 6] (1-indexed [2, 6])']
      ]),
      vis('Two shapes of two pointers', `
flowchart LR
  subgraph Opposite ends
    L1["L →"] --- A1["sorted array"] --- R1["← R"]
  end
  subgraph Same direction
    W["write / slow"] --> A2["array"]
    RD["read / fast"] --> A2
  end
`, 'Opposite ends: sorted input, pair/triple sums, palindromes, area. Same direction: in-place filtering, dedupe, partitioning.'),
      cues(['Input is **sorted** (or you may sort it)', '"Pair / triplet with sum…", "closest sum"', '"Palindrome", "reverse in place"', '"In place, O(1) extra space", "remove duplicates / move zeroes"', '"Container / trap water" — area between two ends']),
      tmpl(`
def two_sum_sorted(nums: list[int], target: int) -> list[int]:
    l, r = 0, len(nums) - 1
    while l < r:
        s = nums[l] + nums[r]
        if s == target:
            return [l + 1, r + 1]
        if s < target:
            l += 1                 # need a bigger sum
        else:
            r -= 1                 # need a smaller sum
    return []

def three_sum(nums: list[int]) -> list[list[int]]:
    nums.sort()
    res = []
    for i in range(len(nums) - 2):
        if i and nums[i] == nums[i - 1]:
            continue               # skip duplicate anchors
        l, r = i + 1, len(nums) - 1
        while l < r:
            s = nums[i] + nums[l] + nums[r]
            if s < 0:
                l += 1
            elif s > 0:
                r -= 1
            else:
                res.append([nums[i], nums[l], nums[r]])
                l += 1
                while l < r and nums[l] == nums[l - 1]:
                    l += 1         # skip duplicate second numbers
    return res

def move_zeroes(nums: list[int]) -> None:
    write = 0                      # same-direction: next slot for a non-zero
    for read in range(len(nums)):
        if nums[read] != 0:
            nums[write], nums[read] = nums[read], nums[write]
            write += 1
`),
      cs(['Tuple swap `a, b = b, a` replaces a temp variable.', '`nums.sort()` sorts in place and returns `None`; `sorted(nums)` returns a new list.']),
      vars(['3Sum: forgetting to skip duplicates → repeated triplets.', 'Using `l <= r` when the two pointers must be different elements.', 'Container With Most Water: always move the **shorter** side — moving the taller can never increase area.', 'Trapping Rain Water: two pointers with `left_max`/`right_max`; process the side with the smaller max.', 'Valid Palindrome II: on first mismatch try skipping either side once.']),
      probs([
        p('Valid Palindrome', 'valid-palindrome', E, 1), p('Merge Sorted Array', 'merge-sorted-array', E, 0), p('Move Zeroes', 'move-zeroes', E, 0),
        p('Valid Palindrome II', 'valid-palindrome-ii', E, 0),
        p('Two Sum II - Input Array Is Sorted', 'two-sum-ii-input-array-is-sorted', M, 1), p('3Sum', '3sum', M, 1),
        p('Container With Most Water', 'container-with-most-water', M, 1), p('Sort Colors', 'sort-colors', M, 0),
        p('Boats to Save People', 'boats-to-save-people', M, 0), p('Trapping Rain Water', 'trapping-rain-water', H, 1)
      ]),
      quiz([
        ['Container With Most Water: which pointer moves?', ['The taller one', 'The shorter one', 'Both', 'Alternate'], 1, 'Area is limited by the shorter line; moving the taller one can only shrink width without raising the limit.'],
        ['3Sum complexity after sorting?', ['O(n)', 'O(n log n)', 'O(n²)', 'O(n³)'], 2, 'Sort O(n log n) + for each anchor an O(n) two-pointer scan.'],
        ['Merge Sorted Array (nums1 has space at the end): best direction?', ['Front to back', 'Back to front, filling from the end', 'Use a new array always', 'Sort afterwards'], 1, 'Filling from the end never overwrites unread nums1 values; O(1) extra space.'],
        ['Which is NOT a two-pointer cue?', ['Sorted input, pair sum', 'Palindrome check', 'Shortest path in a grid', 'Remove duplicates in place'], 2, 'Shortest path in a grid is BFS.']
      ])
    ]),

    // ───────────── 3
    pat('Sliding Window', 'A contiguous window grows on the right and shrinks on the left; each element enters and leaves once → O(n).', [
      steps('Longest substring without repeating characters, s = "abcabcbb"', ['r (char)', 'window before', 'Action', 'window after', 'best'], [
        ['0 (a)', '""', 'add a', '"a"', '1'],
        ['1 (b)', '"a"', 'add b', '"ab"', '2'],
        ['2 (c)', '"ab"', 'add c', '"abc"', '3'],
        ['3 (a)', '"abc"', 'a repeated → move l past old a (l=1)', '"bca"', '3'],
        ['4 (b)', '"bca"', 'b repeated → l=2', '"cab"', '3'],
        ['5 (c)', '"cab"', 'c repeated → l=3', '"abc"', '3'],
        ['6 (b)', '"abc"', 'b repeated → l=5', '"cb"', '3'],
        ['7 (b)', '"cb"', 'b repeated → l=7', '"b"', '3 ✔']
      ]),
      vis('Variable window loop', `
flowchart LR
  A["expand: add s[r]"] --> B{"window valid?"}
  B -->|no| C["shrink: remove s[l], l += 1"]
  C --> B

from collections import deque

class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val, self.left, self.right = val, left, right

def max_depth(root: TreeNode | None) -> int:
    if not root:
        return 0
    return 1 + max(max_depth(root.left), max_depth(root.right))

def diameter(root: TreeNode | None) -> int:
    best = 0
    def height(node):                      # returns height, updates best on the side
        nonlocal best
        if not node:
            return 0
        l, r = height(node.left), height(node.right)
        best = max(best, l + r)            # path through this node
        return 1 + max(l, r)
    height(root)
    return best

def level_order(root: TreeNode | None) -> list[list[int]]:
    if not root:
        return []
    res, q = [], deque([root])
    while q:
        level = []
        for _ in range(len(q)):            # exactly one level

            level.append(node.val)
            if node.left: q.append(node.left)
            if node.right: q.append(node.right)

        path.append(nums[i])                # choose

            if i > start and cands[i] == cands[i - 1]:
                continue                    # skip duplicates (Combination Sum II)
            path.append(cands[i])
            dfs(i, remain - cands[i])       # i: reuse allowed; i + 1: each used once

from collections import defaultdict, deque

def num_islands(grid: list[list[str]]) -> int:
    R, C = len(grid), len(grid[0])
    count = 0
    for r in range(R):
        for c in range(C):
            if grid[r][c] != '1':
                continue
            count += 1
            grid[r][c] = '0'                        # mark visited when ENQUEUED
            q = deque([(r, c)])
            while q:
                x, y = q.popleft()
                for nx, ny in ((x+1, y), (x-1, y), (x, y+1), (x, y-1)):
                    if 0 <= nx < R and 0 <= ny < C and grid[nx][ny] == '1':
                        grid[nx][ny] = '0'
                        q.append((nx, ny))
    return count

def topo_order(n: int, edges: list[tuple[int, int]]) -> list[int]:
    graph, indeg = defaultdict(list), [0] * n
    for a, b in edges:                              # a must come before b
        graph[a].append(b)
        indeg[b] += 1
    q = deque(i for i in range(n) if indeg[i] == 0)
    order = []
    while q:
        u = q.popleft()
        order.append(u)
        for v in graph[u]:
            indeg[v] -= 1
            if indeg[v] == 0:
                q.append(v)
    return order if len(order) == n else []         # [] -> cycle

class DSU:
    def __init__(self, n: int):
        self.parent, self.rank = list(range(n)), [0] * n
    def find(self, x: int) -> int:
        while self.parent[x] != x:
            self.parent[x] = self.parent[self.parent[x]]   # path halving
            x = self.parent[x]
        return x
    def union(self, a: int, b: int) -> bool:
        ra, rb = self.find(a), self.find(b)
        if ra == rb:
            return False                            # already connected -> this edge makes a cycle
        if self.rank[ra] < self.rank[rb]:
            ra, rb = rb, ra
        self.parent[rb] = ra
        self.rank[ra] += self.rank[ra] == self.rank[rb]
        return True

import heapq
from collections import defaultdict

def dijkstra(n: int, edges: list[tuple[int, int, int]], src: int) -> list[float]:
    graph = defaultdict(list)
    for u, v, w in edges:
        graph[u].append((v, w))
    dist = [float('inf')] * n
    dist[src] = 0
    heap = [(0, src)]
    while heap:
        d, u = heapq.heappop(heap)
        if d > dist[u]:
            continue                                # stale entry
        for v, w in graph[u]:
            nd = d + w
            if nd < dist[v]:
                dist[v] = nd
                heapq.heappush(heap, (nd, v))
    return dist

def prim_mst_cost(points: list[list[int]]) -> int:
    n, seen, total = len(points), set(), 0
    heap = [(0, 0)]                                 # (cost to connect, node)
    while len(seen) < n:
        cost, u = heapq.heappop(heap)
        if u in seen:
            continue
        seen.add(u)
        total += cost
        for v in range(n):
            if v not in seen:
                d = abs(points[u][0] - points[v][0]) + abs(points[u][1] - points[v][1])
                heapq.heappush(heap, (d, v))
    return total

from functools import cache

def rob(nums: list[int]) -> int:
    prev2 = prev1 = 0                       # dp[i-2], dp[i-1]
    for x in nums:
        prev2, prev1 = prev1, max(prev1, prev2 + x)
    return prev1

def coin_change(coins: list[int], amount: int) -> int:
    INF = float('inf')
    dp = [0] + [INF] * amount               # dp[a] = min coins to make a
    for a in range(1, amount + 1):
        for c in coins:
            if c <= a:
                dp[a] = min(dp[a], dp[a - c] + 1)
    return -1 if dp[amount] == INF else dp[amount]

def word_break(s: str, words: list[str]) -> bool:
    wordset = set(words)
    @cache                                  # top-down memoisation
    def ok(i: int) -> bool:
        if i == len(s):
            return True
        return any(s[i:j] in wordset and ok(j) for j in range(i + 1, len(s) + 1))
    return ok(0)

def length_of_lis(nums: list[int]) -> int:
    from bisect import bisect_left
    tails: list[int] = []                   # tails[k] = smallest tail of an IS of length k+1
    for x in nums:
        i = bisect_left(tails, x)
        if i == len(tails):
            tails.append(x)
        else:
            tails[i] = x
    return len(tails)                       # O(n log n)

def lcs(s: str, t: str) -> int:
    m, n = len(s), len(t)
    dp = [[0] * (n + 1) for _ in range(m + 1)]
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if s[i - 1] == t[j - 1]:
                dp[i][j] = dp[i - 1][j - 1] + 1
            else:
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
    return dp[m][n]

def edit_distance(a: str, b: str) -> int:
    m, n = len(a), len(b)
    dp = [[0] * (n + 1) for _ in range(m + 1)]
    for i in range(m + 1): dp[i][0] = i
    for j in range(n + 1): dp[0][j] = j
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if a[i - 1] == b[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]
            else:
                dp[i][j] = 1 + min(dp[i - 1][j],      # delete
                                   dp[i][j - 1],      # insert
                                   dp[i - 1][j - 1])  # replace
    return dp[m][n]

def can_partition(nums: list[int]) -> bool:           # 0/1 knapsack, 1-D rolling
    total = sum(nums)
    if total % 2:
        return False
    target = total // 2
    dp = [True] + [False] * target
    for x in nums:
        for s in range(target, x - 1, -1):            # BACKWARDS: each item used once
            dp[s] = dp[s] or dp[s - x]
    return dp[target]

def change_ways(amount: int, coins: list[int]) -> int: # unbounded knapsack, count combos
    dp = [1] + [0] * amount
    for c in coins:                                    # coins outer -> combinations, not permutations
        for s in range(c, amount + 1):                 # FORWARDS: reuse allowed
            dp[s] += dp[s - c]
    return dp[amount]

def max_subarray(nums: list[int]) -> int:          # Kadane
    best = cur = nums[0]
    for x in nums[1:]:

    return best

def can_jump(nums: list[int]) -> bool:
    farthest = 0
    for i, x in enumerate(nums):
        if i > farthest:
            return False
        farthest = max(farthest, i + x)
    return True

def min_jumps(nums: list[int]) -> int:              # BFS by levels, greedy window
    jumps = cur_end = farthest = 0
    for i in range(len(nums) - 1):
        farthest = max(farthest, i + nums[i])
        if i == cur_end:
            jumps += 1
            cur_end = farthest
    return jumps

def can_complete_circuit(gas: list[int], cost: list[int]) -> int:
    if sum(gas) < sum(cost):
        return -1
    tank = start = 0
    for i in range(len(gas)):
        tank += gas[i] - cost[i]
        if tank < 0:
            start, tank = i + 1, 0                  # no station in [start, i] can work
    return start

    for i, ch in enumerate(s):

            start = i + 1

def single_number(nums: list[int]) -> int:

    dp = [0] * (n + 1)
    for i in range(1, n + 1):

    if (html != null) e.innerHTML = html;
    return e;
  }
  const head = b => b.h ? `<h3>${b.tag ? `<span class="tag">${esc(b.tag)}</span>` : ''}${md(b.h)}</h3>` : '';

  // ---------- theme ----------
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(theme);
  const isDark = () => {
    const t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  };
  const themeIcon = () => { $('#themeBtn').textContent = isDark() ? '☀' : '☾'; };
  $('#themeBtn').onclick = () => {
    theme = isDark() ? 'light' : 'dark';
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    themeIcon();
    route(true);
  };
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (!theme) { themeIcon(); route(true); } };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
  }
  themeIcon();
  $('#menuBtn').onclick = () => document.body.classList.toggle('nav-open');

  // ---------- mermaid ----------
  let mermaidReady = false;
  function initMermaid() {
    if (!window.mermaid) return false;
    window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'default', flowchart: { useMaxWidth: true, htmlLabels: true } });
    mermaidReady = true;
    return true;
  }
  async function renderDiagrams(root) {
    const nodes = [...root.querySelectorAll('.diagram[data-src]')];
    if (!nodes.length) return;
    if (!initMermaid()) {
      nodes.forEach(n => { n.innerHTML = '<pre class="code mermaid-src"></pre><p class="small muted">Diagram library offline — Mermaid source shown. Paste it into mermaid.live to view.</p>'; n.firstChild.textContent = n.dataset.src; });
      return;
    }
    for (const [i, n] of nodes.entries()) {
      try {
        const { svg } = await window.mermaid.render('mmd-' + Date.now() + '-' + i, n.dataset.src);
        n.innerHTML = svg;
        const vb = n.querySelector('svg') && n.querySelector('svg').viewBox.baseVal;
        if (vb && vb.width > 700) n.classList.add('wide');
      } catch (err) {
        n.innerHTML = '<pre class="code mermaid-src"></pre>';
        n.firstChild.textContent = n.dataset.src;
      }
    }
  }

  // ---------- block renderers ----------
  const R = {
    visual(b) {
      const f = el('section', 'block');
      f.innerHTML = head(b) + '<figure class="visual"><div class="diagram"></div><figcaption></figcaption></figure>';
      $('.diagram', f).dataset.src = b.mermaid;
      $('figcaption', f).innerHTML = md(b.caption || '') + ' <span>Source: ' + (b.source ? md(b.source) : 'diagram drawn for this guide') + '.</span>';
      return f;
    },
    text(b) { return el('section', 'block', head(b) + paras(b.body)); },
    callout(b) { return el('section', 'block callout', head(b) + paras(b.body)); },
    // concept card: plain-English definition → why → how → example → pitfalls
    concept(b) {
      const row = (label, html) => html ? `<div class="c-row"><div class="c-label">${label}</div><div class="c-body">${html}</div></div>` : '';
      const list = (xs, ordered) => xs && xs.length ? `<${ordered ? 'ol' : 'ul'}>` + xs.map(x => '<li>' + md(x) + '</li>').join('') + `</${ordered ? 'ol' : 'ul'}>` : '';
      const s = el('section', 'block concept',
        `<h3><span class="tag">${esc(b.tag || 'Concept')}</span>${md(b.h)}</h3>` +
        row('What it is', b.what && paras(b.what)) +
        row('Think of it as', b.analogy && paras(b.analogy)) +
        row('Why it matters', b.why && paras(b.why)) +
        row('How it works', Array.isArray(b.how) ? list(b.how, true) : b.how && paras(b.how)) +
        row('Example', (b.example ? paras(b.example) : '') + (b.code ? '<pre class="code"><code></code></pre>' : '') + (b.table ? '<div class="table-wrap"><table><thead><tr>' + b.table.cols.map(c => '<th>' + md(c) + '</th>').join('') + '</tr></thead><tbody>' + b.table.rows.map(r => '<tr>' + r.map(c => '<td>' + md(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' : '')) +
        row('Watch out', list(b.pitfalls)));
      if (b.code) $('pre.code code', s).textContent = b.code.replace(/^\n/, '');
      return s;
    },
    glossary(b) {
      return el('section', 'block', '<h3><span class="tag">Glossary</span>Key terms in this module</h3><div class="table-wrap"><table><thead><tr><th>Term</th><th>Plain-English meaning</th></tr></thead><tbody>' +
        b.terms.map(([t, d]) => `<tr><td><b>${md(t)}</b></td><td>${md(d)}</td></tr>`).join('') + '</tbody></table></div>');
    },
    walkthrough(b) {
      return el('section', 'block callout', head(b) + '<ol class="walk">' + b.steps.map(([t, d]) => `<li><b>${md(t)}</b><div>${paras(d)}</div></li>`).join('') + '</ol>');
    },
    csnote(b) { return el('section', 'block csnote', '<h3><span class="tag">C# → Python</span></h3><ul>' + b.items.map(i => '<li>' + md(i) + '</li>').join('') + '</ul>'); },
    list(b) {
      const t = b.ordered ? 'ol' : 'ul';
      return el('section', 'block', head(b) + `<${t}>` + b.items.map(i => '<li>' + md(i) + '</li>').join('') + `</${t}>`);
    },
    code(b) {
      const s = el('section', 'block', head(b) + '<pre class="code"><code></code></pre>' + (b.note ? '<p class="small muted" style="margin-top:10px">' + md(b.note) + '</p>' : ''));
      $('pre.code code', s).textContent = b.code.replace(/^\n/, '');
      return s;
    },
    table(b) {
      return el('section', 'block', head(b) + '<div class="table-wrap"><table><thead><tr>' + b.cols.map(c => '<th>' + md(c) + '</th>').join('') +
        '</tr></thead><tbody>' + b.rows.map(r => '<tr>' + r.map(c => '<td>' + md(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
    },
    refs(b) {
      return el('section', 'block', '<h3><span class="tag">Read</span>Diagrams &amp; references</h3><ul>' +
        b.items.map(([l, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${md(l)}</a></li>`).join('') + '</ul>');
    },
    problems(b, item) {
      const s = el('section', 'block', head(Object.assign({ h: 'Question set', tag: 'Practice' }, b)) +
        '<p class="small muted">Tick a problem when you have solved it on your own (no HINT / SOLUTION). 🔒 = LeetCode Premium; the same problem is free on NeetCode or LintCode.</p>' +
        '<div class="table-wrap"><table><thead><tr><th></th><th>#</th><th>Problem</th><th>Difficulty</th><th>Asked at</th><th>List</th></tr></thead><tbody></tbody></table></div>');
      const tb = $('tbody', s);
      b.rows.forEach((r, i) => {
        const [title, slug, diff, asked, list, premium] = r;
        const tr = el('tr', S.solved[slug] ? 'solved' : '');
        tr.innerHTML = `<td class="chk"><input type="checkbox" aria-label="solved"${S.solved[slug] ? ' checked' : ''}></td><td>${i + 1}</td>` +
          `<td><a href="https://leetcode.com/problems/${esc(slug)}/" target="_blank" rel="noopener">${esc(title)}</a>${premium ? ' 🔒' : ''}</td>` +
          `<td><span class="diff ${esc(diff)}">${esc(diff)}</span></td><td>${md(asked || 'commonly reported')}</td><td class="small">${md(list || '')}</td>`;
        $('input', tr).onchange = e => {
          if (e.target.checked) S.solved[slug] = true; else delete S.solved[slug];
          tr.className = e.target.checked ? 'solved' : '';
          save(); renderNav(item.id);
        };
        tb.appendChild(tr);
      });
      return s;
    },
    quiz(b, item) {
      const qs = b.qs;
      const s = el('section', 'block quiz', `<h3><span class="tag">Quiz</span>${md(b.h || 'Check yourself')} <span class="muted small">· ${qs.length} questions</span></h3>`);
      const state = new Array(qs.length).fill(null);
      const answers = [];
      const score = el('span', 'score');
      qs.forEach((q, qi) => {
        const [text, rawOpts, rawAns, why] = q;
        // shuffle options so the correct answer's position carries no signal
        const order = rawOpts.map((_, i) => i);
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
        const opts = order.map(i => rawOpts[i]);
        const ans = order.indexOf(rawAns);
        answers[qi] = ans;
        const card = el('div', 'q', `<p class="q-text"><b>Q${qi + 1}.</b> ${md(text)}</p><div class="opts"></div><p class="why" hidden></p>`);
        const box = $('.opts', card);
        opts.forEach((o, oi) => {
          const btn = el('button', 'opt', `<span class="letter">${'ABCDEF'[oi]}</span><span>${md(o)}</span>`);
          btn.onclick = () => {
            if (state[qi] !== null) return;
            state[qi] = oi;
            [...box.children].forEach((c, ci) => {
              c.disabled = true;
              if (ci === ans) c.classList.add('correct'); else if (ci === oi) c.classList.add('wrong');
            });
            const w = $('.why', card);
            w.hidden = false;
            w.innerHTML = (oi === ans ? '<b class="ok">Correct.</b> ' : '<b class="no">Not quite.</b> ') + md(why);
            update();
          };
          box.appendChild(btn);
        });
        s.appendChild(card);
      });
      const foot = el('div', 'quiz-foot');
      const prev = S.quiz[item.id];
      const best = el('span', 'muted small', prev ? `Best so far: ${prev.best}/${prev.total}` : '');
      const retry = el('button', 'btn', 'Retry quiz');
      retry.onclick = () => route(true);
      foot.append(score, best, retry);
      s.appendChild(foot);
      function update() {
        const answered = state.filter(x => x !== null).length;
        const right = state.filter((x, i) => x === answers[i]).length;
        score.textContent = `Score: ${right}/${answered}` + (answered < qs.length ? ` (${qs.length - answered} left)` : '');
        if (answered === qs.length) {
          const p = S.quiz[item.id];
          S.quiz[item.id] = { last: right, best: Math.max(right, p ? p.best : 0), total: qs.length };
          best.textContent = `Best so far: ${S.quiz[item.id].best}/${qs.length}`;
          save(); renderNav(item.id);
        }
      }
      update();
      return s;
    }
  };

  // ---------- progress ----------
  function pct() { return Math.round(100 * modules.filter(m => S.done[m.id]).length / modules.length); }
  const label = i => (i.kind === 'checkpoint' ? '' : i.num + '. ') + i.title;
  function progressBlock() {
    const done = modules.filter(m => S.done[m.id]);
    const last = done[done.length - 1];
    const next = modules.find(m => !S.done[m.id]);
    const struggled = [];
    items.forEach(i => {
      const q = S.quiz[i.id];
      if (S.struggled[i.id] && S.struggled[i.id].trim()) struggled.push(`${i.short || i.title}: ${S.struggled[i.id].trim().replace(/\s*\n\s*/g, '; ')}`);
      if (q && q.last / q.total < 0.7) struggled.push(`${i.short || i.title} quiz ${q.last}/${q.total}`);
    });
    const solved = Object.keys(S.solved).length;
    return [
      'PROGRESS',
      `Track | ${T.key} — ${T.name}`,
      `Module done | ${last ? label(last) : 'none yet'}${done.length ? ` (${done.length}/${modules.length} complete)` : ''}${T.showSolved ? ` · ${solved} problems solved` : ''}`,
      `Topics I struggled with | ${struggled.length ? struggled.join(' · ') : 'none recorded'}`,
      `Next module | ${next ? label(next) : 'track complete'}`
    ].join('\n');
  }
  function copy(text, btn) {
    const done = () => { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = o; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
    else fallback();
    function fallback() {
      const ta = el('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.remove();
    }
  }

  // ---------- nav ----------
  function status(i) {
    if (i.kind === 'checkpoint') return S.quiz[i.id] ? '✅' : '🧩';
    return S.done[i.id] ? '✅' : '⬜';
  }
  function renderNav(active) {
    const side = $('#side');
    let html = `<a class="nav${active === 'home' ? ' active' : ''}" href="#home"><span class="st">🗺</span>Roadmap</a>` +
      `<a class="nav${active === 'progress' ? ' active' : ''}" href="#progress"><span class="st">📋</span>Progress &amp; commands</a>`;
    let group = null;
    items.forEach(i => {
      if (i.group !== group) { group = i.group; if (group) html += `<h4>${md(group)}</h4>`; }
      const q = S.quiz[i.id];
      html += `<a class="nav${i.kind === 'checkpoint' ? ' checkpoint' : ''}${active === i.id ? ' active' : ''}" href="#${i.id}"><span class="st">${status(i)}</span><span>${md(label(i))}</span>` +
        (q ? `<span class="sc">${q.best}/${q.total}</span>` : '') + '</a>';
    });
    html += '<h4>Other tracks</h4><div class="tracks">' + T.otherTracks.map(([l, f]) => `<a href="${esc(f)}">${md(l)}</a>`).join('') + '<a href="index.html">All tracks</a></div>';
    side.innerHTML = html;
    $('#barFill').style.width = pct() + '%';
    $('#barText').textContent = modules.filter(m => S.done[m.id]).length + '/' + modules.length;
  }

  // ---------- views ----------
  function viewHome(main) {
    main.appendChild(el('div', 'hero', `<div class="kicker">Track ${esc(T.key)}</div><h1>${md(T.name)}</h1>${paras(T.intro)}`));
    const rm = el('section', 'block', '<h3><span class="tag">Roadmap</span>Fixed path — one module per session</h3><ul class="roadmap"></ul>');
    const ul = $('ul', rm);
    items.forEach(i => {
      const q = S.quiz[i.id];
      const li = el('li', '', `<span>${status(i)}</span><a href="#${i.id}">${md(label(i))}</a><span class="sc">${q ? 'quiz ' + q.best + '/' + q.total : ''}</span>`);
      ul.appendChild(li);
    });
    main.appendChild(rm);
    (T.homeBlocks || []).forEach(b => main.appendChild(R[b.type](b, { id: 'home' })));
  }
  function viewProgress(main) {
    main.appendChild(el('div', 'hero', `<div class="kicker">Track ${esc(T.key)}</div><h1>Progress &amp; commands</h1><p class="muted">Paste this block at the start of your next tutor session to resume exactly where you left off.</p>`));
    const pb = el('section', 'block', '<h3><span class="tag">Resume</span>PROGRESS block</h3><pre class="code progress-block"></pre><div class="row" style="margin-top:12px"></div>');
    $('pre', pb).textContent = progressBlock();
    const c = el('button', 'btn primary', 'Copy PROGRESS block');
    c.onclick = () => copy(progressBlock(), c);
    const next = modules.find(m => !S.done[m.id]);
    const st = el('button', 'btn', next ? `Copy “START: ${T.cmd} ${next.num}”` : 'Track complete');
    if (next) st.onclick = () => copy(`START: ${T.cmd} ${next.num}`, st);
    $('.row', pb).append(c, st);
    main.appendChild(pb);
    main.appendChild(el('section', 'block', '<h3><span class="tag">Tutor</span>Commands</h3><div class="cmds">' + [
      ['START: ' + T.cmd + ' <n>', 'Begin module n of this track directly'],
      ['NEXT', 'Move to the next module or question'],
      ['HINT', 'Next hint only — never the full answer'],
      ['SOLUTION', 'Full optimal solution with explanation'],
      ['SIMPLER', 'Re-explain with a simpler analogy'],
      ['DEEPER', 'One level deeper: internals, edge cases, trade-offs'],
      ['REVISE', 'Quick recap of everything done in this track'],
      ['ROADMAP', 'Full path with ✅ for completed modules']
    ].map(([k, v]) => `<code>${esc(k)}</code><span>${esc(v)}</span>`).join('') + '</div>'));
    const reset = el('section', 'block', '<h3>Reset</h3><p class="muted small">Progress lives only in this browser. Resetting clears ticks, quiz scores and notes for this track.</p>');
    const rb = el('button', 'btn', 'Reset this track');
    rb.onclick = () => { if (confirm('Clear all progress for this track?')) { S = { done: {}, quiz: {}, struggled: {}, solved: {} }; save(); route(); } };
    reset.appendChild(rb);
    main.appendChild(reset);
  }
  function viewItem(main, item) {
    const idx = items.indexOf(item);
    main.appendChild(el('div', 'hero', `<div class="kicker">${item.group ? md(item.group) + ' · ' : ''}${item.kind === 'checkpoint' ? 'Checkpoint' : 'Module ' + item.num + ' of ' + modules.length}</div><h1>${md(item.title)}</h1>${item.summary ? '<p class="muted">' + md(item.summary) + '</p>' : ''}`));
    item.blocks.forEach(b => {
      if (!R[b.type]) return;
      main.appendChild(R[b.type](b, item));
    });
    if (item.kind !== 'checkpoint') {
      const end = el('section', 'block', '<h3><span class="tag">Wrap-up</span>End of session</h3><p class="small muted">Note anything that felt shaky — it goes into your PROGRESS block.</p><textarea placeholder="Topics I struggled with…"></textarea><div class="row" style="margin-top:12px"></div>');
      const ta = $('textarea', end);
      ta.value = S.struggled[item.id] || '';
      ta.oninput = () => { S.struggled[item.id] = ta.value; save(); };
      const db = el('button', 'btn' + (S.done[item.id] ? ' done' : ' primary'), S.done[item.id] ? '✅ Module done' : 'Mark module done');
      db.onclick = () => {
        if (S.done[item.id]) delete S.done[item.id]; else S.done[item.id] = Date.now();
        save(); route(true);
      };
      const pb = el('button', 'btn', 'Copy PROGRESS block');
      pb.onclick = () => copy(progressBlock(), pb);
      const sb = el('button', 'btn', `Copy “START: ${T.cmd} ${item.num}”`);
      sb.onclick = () => copy(`START: ${T.cmd} ${item.num}`, sb);
      $('.row', end).append(db, pb, sb);
      main.appendChild(end);
    }
    const pager = el('div', 'pager');
    const prev = items[idx - 1], next = items[idx + 1];
    pager.innerHTML = (prev ? `<a class="btn" href="#${prev.id}">← ${md(label(prev))}</a>` : '<span></span>') +
      (next ? `<a class="btn primary" href="#${next.id}">${md(label(next))} →</a>` : '');
    main.appendChild(pager);
  }

  function route(keepScroll) {
    const id = decodeURIComponent(location.hash.slice(1)) || 'home';
    const main = $('#main');
    const y = window.scrollY;
    main.innerHTML = '';
    if (id === 'progress') viewProgress(main);
    else if (byId[id]) viewItem(main, byId[id]);
    else viewHome(main);
    renderNav(byId[id] || id === 'progress' ? id : 'home');
    document.title = (byId[id] ? label(byId[id]) + ' · ' : '') + T.title;
    document.body.classList.remove('nav-open');
    if (keepScroll === true) window.scrollTo(0, y); else window.scrollTo(0, 0);
    renderDiagrams(main);
  }

  $('#trackName').textContent = T.name;
  window.addEventListener('hashchange', () => route());
  route();
})();

</script>
</body>
</html>
